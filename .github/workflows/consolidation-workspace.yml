name: Consolidation workspace snapshot
on:
  push:
    branches: [ci/otlp-service-publish-20260925]
    paths: [.github/workflows/consolidation-workspace.yml]
permissions:
  contents: read
  pull-requests: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 834dc931abb0509a63383eacf212f3f1e59656a0
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - name: Retain all current refs and verified native dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/consolidation-workspace
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git bundle create /tmp/consolidation-workspace/source.bundle --all HEAD
          git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin > /tmp/consolidation-workspace/refs.txt
          gh api --paginate 'repos/Laisky/go-fluentd/pulls?state=all&per_page=100' --jq '.[] | {number,title,state,merged_at,head:.head.ref,head_sha:.head.sha,base:.base.ref}' > /tmp/consolidation-workspace/pulls.jsonl
          go version > /tmp/consolidation-workspace/toolchain.txt
          go mod download
          go mod verify > /tmp/consolidation-workspace/module-verify.txt
          tar -czf /tmp/consolidation-workspace/modules.tar.gz -C "$(go env GOMODCACHE)" .
          tar -czf /tmp/consolidation-workspace/go.tar.gz -C "$(go env GOROOT)" .
          cd /tmp/consolidation-workspace
          sha256sum source.bundle refs.txt pulls.jsonl toolchain.txt module-verify.txt modules.tar.gz go.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consolidation-workspace
          path: /tmp/consolidation-workspace
          if-no-files-found: error
          retention-days: 7
