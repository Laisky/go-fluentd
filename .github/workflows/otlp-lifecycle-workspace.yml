name: OTLP lifecycle workspace
on:
  push:
    branches: [ci/otlp-lifecycle-workspace-20260924]
    paths: [.github/workflows/otlp-lifecycle-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 226485ca0fc076f06899a1de38c5b704b776fb57
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - name: Export immutable source and native cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/otlp-lifecycle-workspace
          git bundle create /tmp/otlp-lifecycle-workspace/source.bundle HEAD --all
          git rev-parse HEAD > /tmp/otlp-lifecycle-workspace/head.txt
          git rev-parse HEAD^{tree} > /tmp/otlp-lifecycle-workspace/tree.txt
          go version > /tmp/otlp-lifecycle-workspace/go.txt
          cp go.mod go.sum /tmp/otlp-lifecycle-workspace/
          go mod download
          go mod verify | tee /tmp/otlp-lifecycle-workspace/verify.txt
          tar -czf /tmp/otlp-lifecycle-workspace/modules.tar.gz -C "$(go env GOMODCACHE)" --exclude='golang.org/toolchain*' .
          cd /tmp/otlp-lifecycle-workspace
          sha256sum source.bundle modules.tar.gz go.mod go.sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: otlp-lifecycle-workspace
          path: /tmp/otlp-lifecycle-workspace
          retention-days: 7
