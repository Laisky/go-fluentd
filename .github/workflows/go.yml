name: Go

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
      - run: go version
      - run: go mod verify
      - run: go build -mod=readonly ./...
      - run: go vet -mod=readonly ./...
      - name: Behavior tests and component coverage floors
        run: |
          go test -mod=readonly -count=1 -timeout=180s -coverprofile=/tmp/component.cover ./...
          python3 .scripts/check_component_coverage.py /tmp/component.cover
          go tool cover -func=/tmp/component.cover
      - name: Randomized full-suite race tests
        run: go test -mod=readonly -race -count=5 -shuffle=on -timeout=180s ./...
      - name: Repeat component and regression contracts
        run: go test -mod=readonly -race -count=10 -shuffle=on -timeout=180s -run 'Test(Regression|Component)' ./...
      - name: MessagePack routing and decoded-string lifetime under GC pressure
        run: |
          mkdir -p /tmp/msgpack-gc
          git rev-parse HEAD > /tmp/msgpack-gc/source.txt
          cp go.mod go.sum /tmp/msgpack-gc/
          GOMAXPROCS=2 GOGC=10 go test -mod=readonly -race -count=1000 -timeout=180s -json -run '^TestRegressionFluent(ConcurrentTagRouting|WireOracleRejectsWrongRoute)$' ./internal/senders > /tmp/msgpack-gc/tests.jsonl
          python3 - <<'PY'
          import collections, json
          rows = [json.loads(line) for line in open('/tmp/msgpack-gc/tests.jsonl')]
          assert not any(row['Action'] in ('fail', 'skip') for row in rows)
          counts = collections.Counter(row.get('Test') for row in rows if row['Action'] == 'pass' and 'Test' in row)
          assert counts == {'TestRegressionFluentConcurrentTagRouting': 1000, 'TestRegressionFluentWireOracleRejectsWrongRoute': 1000}, counts
          PY
      - name: Retain GC regression results even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: msgpack-gc-regression
          path: /tmp/msgpack-gc
          if-no-files-found: ignore
          retention-days: 14
      - run: git diff --exit-code -- go.mod go.sum
      - name: Retain the measured coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-coverage
          path: /tmp/component.cover
          if-no-files-found: error
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and smoke-test the runtime image
        run: |
          docker build -f .docker/Dockerfile -t go-fluentd:ci .
          docker run --rm go-fluentd:ci --help
      - name: Run the test image
        run: |
          docker build -f .docker/test.Dockerfile -t go-fluentd-test:ci .
          docker run --rm go-fluentd-test:ci
      - name: Validate the legacy forward Go build stage
        run: docker build --target gobin -f .docker/forward.Dockerfile -t go-fluentd-forward-build:ci .
