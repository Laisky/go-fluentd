name: Group validation snapshot
on:
  push:
    branches: [perf/group-commit-validation-snapshot-20260923]
    paths: [.github/workflows/group-validation-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - run: |
          mkdir -p /tmp/group-validation
          git bundle create /tmp/group-validation/source.bundle HEAD refs/remotes/origin/master refs/remotes/origin/perf/durable-group-commit-20260923
          go mod download
          go list -m -json github.com/Laisky/go-journal > /tmp/group-validation/journal.json
          dir=$(go list -m -f '{{.Dir}}' github.com/Laisky/go-journal)
          tar -czf /tmp/group-validation/journal.tar.gz -C "$dir" .
          go version > /tmp/group-validation/toolchain.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: group-validation-source
          path: /tmp/group-validation
          retention-days: 3
