name: E2E test workspace
on:
  push:
    branches: [test/e2e-delivery-20260922]
    paths: [.github/workflows/e2e-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: |
          git bundle create /tmp/e2e-source.bundle --all
          git rev-parse HEAD > /tmp/e2e-source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-source
          path: /tmp/e2e-source*
          retention-days: 3
