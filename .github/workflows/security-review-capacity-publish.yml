name: Verify and publish capacity patch
on:
  push:
    branches: [codex/security-review-workspace-20261006]
    paths: [.github/workflows/security-review-capacity-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify exact reviewed bytes before publication
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          request = json.loads(pathlib.Path('.review/request.json').read_text())
          assert request['base'] == 'e174aa4741826290c600a415c931fb7130b46d32'
          assert request['branch'] == 'codex/security-27-otlp-capacity-20261006'
          encoded = request['patch']
          assert hashlib.sha256(encoded.encode()).hexdigest() == 'ab982a8fd29a63c16d8eb03f8f0ca1f854750dd4f5041eef9136d4dfe815a387'
          missing = ''
          encoded = encoded[:14287] + missing + encoded[14287:]
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '9849ef4f48ec27e95f7094408f51769df1ff91fc586cbac6ad2c1d38ed812c9f'
          def git(*args, **kwargs):
              return subprocess.run(['git', *args], check=True, **kwargs)
          git('checkout', '--detach', request['base'])
          git('apply', '--index', '--whitespace=error', '-', input=patch)
          git('diff', '--cached', '--check')
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', request['message'])
          branch = request['branch']
          git('push', f'--force-with-lease=refs/heads/{branch}:', 'origin', f'HEAD:refs/heads/{branch}')
          git('rev-parse', 'HEAD')
          git('show', '--stat', '--oneline', 'HEAD')
          PY
