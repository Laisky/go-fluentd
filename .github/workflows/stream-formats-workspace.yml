name: Stream formats workspace
on:
  push:
    branches: [ci/publish-stream-formats-20260924]
    paths: [.github/workflows/stream-formats-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f053ffb43cc92c81d7d28f586b1825d15b324d23
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - name: Export source and unchanged verified dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stream-workspace
          git fetch origin chore/modern-formats-preflight-20260924
          git bundle create /tmp/stream-workspace/source.bundle --all HEAD
          git rev-parse HEAD > /tmp/stream-workspace/base.txt
          go version > /tmp/stream-workspace/toolchain.txt
          go mod download
          go mod verify > /tmp/stream-workspace/verify.txt
          tar -czf /tmp/stream-workspace/modules.tar.gz -C "$(go env GOMODCACHE)" .
          sha256sum /tmp/stream-workspace/* > /tmp/stream-workspace/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stream-formats-workspace
          path: /tmp/stream-workspace
          retention-days: 7
