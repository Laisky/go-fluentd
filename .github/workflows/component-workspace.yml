name: Component workspace
on:
  push:
    branches: [test/component-behavior-20260922]
    paths: [.github/workflows/component-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.x
      - name: Pack repository, public dependencies and toolchain
        run: |
          go mod download
          mkdir -p /tmp/component-bundle
          tar -czf /tmp/component-bundle/source.tar.gz --exclude=.git -C "$GITHUB_WORKSPACE" .
          tar -czf /tmp/component-bundle/go.tar.gz -C "$(go env GOROOT)" .
          tar -czf /tmp/component-bundle/modules.tar.gz -C "$(go env GOMODCACHE)" .
          git rev-parse HEAD > /tmp/component-bundle/source-commit.txt
          go version > /tmp/component-bundle/toolchain.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: component-workspace
          path: /tmp/component-bundle
          compression-level: 0
          retention-days: 3
