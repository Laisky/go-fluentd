name: Replay finalization
on:
  push:
    branches: [fix/go127-reliability]
    paths: [.github/workflows/replay-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'Laisky/go-fluentd' && github.ref == 'refs/heads/fix/go127-reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: Pin the completed companion and reproduce ownership edge cases
        run: |
          go get github.com/Laisky/go-journal@86ddbb3d3069937db12d02979b347b3c9baad0a3
          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/controller/journal.go');s=p.read_text()
          start=s.index('func (j *Journal) processLegacyMsg(');end=s.index('// createJournalRunner',start)
          part=s[start:end].replace('jj *journal.Journal','jj legacyJournal').replace('v.(*journal.Journal)','v.(legacyJournal)')
          interface='''// LoadLegacyBuf releases the legacy lock itself on EOF or error.
          type legacyJournal interface {
              LockLegacy() bool
              UnLockLegacy() bool
              LoadLegacyBuf(*journal.Data) error
              WriteData(*journal.Data) error
          }

          '''
          s=s[:start]+interface+part+s[end:];p.write_text(s)
          p=Path('internal/controller/journal_reliability_test.go');s=p.read_text();s+=r'''
          type regressionReplayBackend struct {
              loadError error
              malformed bool
              unlockCalls int
              writes int
          }
          func (*regressionReplayBackend) LockLegacy()bool{return true}
          func (b *regressionReplayBackend) UnLockLegacy()bool{b.unlockCalls++;return true}
          func (b *regressionReplayBackend) LoadLegacyBuf(data *journal.Data)error{
              if b.malformed {data.ID=42;data.Data=map[string]interface{}{"tag":123,"message":map[string]interface{}{"payload":"keep"}};return nil}
              // Model the documented backend handoff: EOF/error already released
              // our lock, and another owner may acquire it before this returns.
              return b.loadError
          }
          func (b *regressionReplayBackend) WriteData(*journal.Data)error{b.writes++;return nil}
          func regressionControllerForBackend(b legacyJournal)*Journal{
              j:=&Journal{JournalCfg:&JournalCfg{MsgPool:&sync.Pool{New:func()interface{}{return &library.FluentMsg{}}}},legacyLock:utils.NewMutex(),tag2JMap:&sync.Map{}}
              j.tag2JMap.Store("logs",b);return j
          }
          func TestRegressionReplayDoesNotReleaseAnotherOwner(t *testing.T){
              for _,err:=range []error{io.EOF,io.ErrUnexpectedEOF}{
                  b:=&regressionReplayBackend{loadError:err}
                  regressionControllerForBackend(b).ProcessLegacyMsg(make(chan *library.FluentMsg,1))
                  if b.unlockCalls!=0{t.Errorf("released another owner's lock %d times after %v",b.unlockCalls,err)}
              }
          }
          func TestRegressionReplayMalformedRecordPreserved(t *testing.T){
              b:=&regressionReplayBackend{malformed:true}
              _,err:=regressionControllerForBackend(b).ProcessLegacyMsg(make(chan *library.FluentMsg,1))
              if err==nil {t.Error("malformed record accepted")}
              if b.writes!=1 {t.Errorf("malformed record lost its replacement copy: writes=%d",b.writes)}
              if b.unlockCalls!=1 {t.Errorf("owned lock not released exactly once: %d",b.unlockCalls)}
          }
          ''';p.write_text(s)
          PY
          gofmt -w internal/controller/journal.go internal/controller/journal_reliability_test.go
          git config user.name 'Laisky'
          git config user.email 'public@laisky.com'
          git add go.mod go.sum internal/controller/journal.go internal/controller/journal_reliability_test.go
          git commit -m 'test: verify replay lock handoff and preservation of malformed records'
          git push origin HEAD:refs/heads/fix/go127-reliability
          python3 - <<'PY'
          import subprocess,json
          p=subprocess.run(['go','test','-json','-mod=readonly','-count=1','-run','TestRegressionReplayDoesNotReleaseAnotherOwner|TestRegressionReplayMalformedRecordPreserved','./internal/controller'],capture_output=True,text=True)
          print(p.stdout);print(p.stderr)
          failed={json.loads(x).get('Test') for x in p.stdout.splitlines() if x.startswith('{') and json.loads(x).get('Action')=='fail'}
          assert {'TestRegressionReplayDoesNotReleaseAnotherOwner','TestRegressionReplayMalformedRecordPreserved'}<=failed
          PY
      - name: Keep cleanup ownership local and preserve rejected records
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/controller/journal.go');s=p.read_text()
          old='defer jj.UnLockLegacy()'
          assert s.count(old)==1
          s=s.replace(old,'ownsLegacy := true\n\t\t\tdefer func(){ if ownsLegacy { jj.UnLockLegacy() } }()')
          old='if err := jj.LoadLegacyBuf(data); err == io.EOF {\n\t\t\t\t\treturn\n\t\t\t\t} else if err != nil {\n\t\t\t\t\treplayErr = err\n\t\t\t\t\treturn\n\t\t\t\t}'
          assert old in s
          s=s.replace(old,'''if err := jj.LoadLegacyBuf(data); err != nil {
                      // The backend has already released our lock. A deferred
                      // unlock here could steal a concurrent rotation's lock.
                      ownsLegacy = false
                      if err != io.EOF { replayErr = err }
                      return
                  }''')
          start=s.index('storedTag, tagOK :=');end=s.index('if data.ID > innerMax',start)
          old=s[start:end]
          replacement='''// Preserve even malformed records before rejecting them. The
                  // reader has advanced, so a later replay may reach cleanup.
                  if replayErr = jj.WriteData(data); replayErr != nil { return }
                  storedTag, tagOK := data.Data["tag"].(string)
                  message, messageOK := data.Data["message"].(map[string]interface{})
                  if !tagOK || !messageOK { replayErr = fmt.Errorf("invalid persisted message %d", data.ID); return }
                  '''
          s=s[:start]+replacement+s[end:];p.write_text(s)
          PY
          gofmt -w internal/controller/journal.go
          go test -mod=readonly -count=1 -timeout=120s ./...
          go test -mod=readonly -race -count=1 -timeout=120s ./...
          go test -mod=readonly -race -count=10 -timeout=180s -run TestRegression ./...
          go vet -mod=readonly ./...
          go build -mod=readonly ./...
          go mod verify
          git add internal/controller/journal.go
          git diff --cached --check
          git commit -m 'fix: respect replay lock ownership and retain malformed records'
          git push origin HEAD:refs/heads/fix/go127-reliability
          git rev-parse HEAD
