name: Group commit workspace
on:
  push:
    branches: [perf/durable-group-commit-20260923]
    paths: [.github/workflows/group-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - run: |
          mkdir -p /tmp/group-workspace
          git bundle create /tmp/group-workspace/app.bundle --all
          go mod download
          d=$(go list -m -f '{{.Dir}}' github.com/Laisky/go-journal)
          tar -czf /tmp/group-workspace/journal-module.tar.gz -C "$d" .
          go list -m -json github.com/Laisky/go-journal > /tmp/group-workspace/journal-module.json
          go version > /tmp/group-workspace/toolchain.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: group-workspace
          path: /tmp/group-workspace/
          retention-days: 3
