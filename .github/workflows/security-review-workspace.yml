name: Security Review Workspace

on:
  push:
    branches: [codex/security-review-workspace-20261006]
    paths: [.github/workflows/security-review-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - name: Prepare public source and offline test dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/review
          git archive 5384f555ca055996a62cc40bd13f96824c8dd26d | tar -x -C /tmp/review
          cd /tmp/review
          go mod vendor
          printf 'source=%s\n' 5384f555ca055996a62cc40bd13f96824c8dd26d > REVIEW_SOURCE.txt
          go version >> REVIEW_SOURCE.txt
          tar -czf /tmp/review-source.tar.gz .
          tar -czf /tmp/review-toolchain.tar.gz -C "$(go env GOROOT)" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-security-review
          path: |
            /tmp/review-source.tar.gz
            /tmp/review-toolchain.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
