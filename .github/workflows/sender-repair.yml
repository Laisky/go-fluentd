name: Sender repair

on:
  push:
    branches: [fix/go127-reliability]
    paths: [.github/workflows/sender-repair.yml]

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'Laisky/go-fluentd' && github.ref == 'refs/heads/fix/go127-reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: Apply confirmed fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, (path, old)
              p.write_text(s.replace(old, new))
          p = Path('library/fluentd.go')
          s = p.read_text()
          s = s.replace('type FluentEncoder struct {', 'type FluentEncoder struct {\n\tbatchEntries []*[]interface{}')
          begin = s.index('func (e *FluentEncoder) EncodeBatch(')
          end = s.index('func (e *FluentEncoder) Flush()', begin)
          s = s[:begin] + '''// EncodeBatch borrows distinct wrappers and returns each original pool object once.
          // Message references are cleared before returning wrappers to the shared pool.
          func (e *FluentEncoder) EncodeBatch(tag string, msgBatch []*FluentMsg) (err error) {
              e.batchWrap[1] = e.batchWrap[1].([]interface{})[:0]
              e.batchEntries = e.batchEntries[:0]
              for _, msg := range msgBatch {
                  entry := fluentdWrapMsgPool.Get().(*[]interface{})
                  (*entry)[1] = msg.Message
                  e.batchEntries = append(e.batchEntries, entry)
                  e.batchWrap[1] = append(e.batchWrap[1].([]interface{}), *entry)
              }
              e.batchWrap[0] = tag
              err = e.batchWrap.EncodeMsg(e.writer)
              for i, entry := range e.batchEntries {
                  (*entry)[1] = nil
                  fluentdWrapMsgPool.Put(entry)
                  e.batchEntries[i] = nil
                  e.batchWrap[1].([]interface{})[i] = nil
              }
              e.batchEntries = e.batchEntries[:0]
              e.batchWrap[1] = e.batchWrap[1].([]interface{})[:0]
              return err
          }

          ''' + s[end:]
          p.write_text(s)
          Path('internal/senders/bulk.go').write_text('''package senders

          import (
              "bytes"
              "compress/gzip"
          )

          // reset initializes the zero-value context used by HTTP workers and reuses
          // buffers between complete, synchronous requests. Contexts are worker-owned.
          func (b *bulkOpCtx) reset() {
              if b.buf == nil { b.buf = new(bytes.Buffer) }
              b.buf.Reset()
              if b.gzWriter == nil { b.gzWriter = gzip.NewWriter(b.buf) } else { b.gzWriter.Reset(b.buf) }
          }
          ''')
          p = Path('internal/senders/httpforward.go')
          s = p.read_text().replace('"fmt"', '"fmt"\n\t"io"')
          begin = s.index('func (s *HTTPSender) SendBulkMsgs(')
          s = s[:begin] + '''func (s *HTTPSender) SendBulkMsgs(bulkCtx *bulkOpCtx, msgs []*library.FluentMsg) error {
              if len(msgs) == 0 { return nil }
              if bulkCtx == nil { return fmt.Errorf("nil bulk context") }
              records := make([]map[string]interface{}, 0, len(msgs))
              for _, msg := range msgs {
                  if msg == nil { return fmt.Errorf("nil message in HTTP batch") }
                  records = append(records, msg.Message)
              }
              data, err := utils.JSON.Marshal(records)
              if err != nil { return errors.Wrap(err, "marshal HTTP batch") }
              bulkCtx.reset()
              if _, err = bulkCtx.gzWriter.Write(data); err != nil { return errors.Wrap(err, "compress HTTP batch") }
              // Flush alone does not write the gzip trailer.
              if err = bulkCtx.gzWriter.Close(); err != nil { return errors.Wrap(err, "finish gzip HTTP batch") }
              req, err := http.NewRequest("POST", s.Addr, bulkCtx.buf)
              if err != nil { return errors.Wrap(err, "create HTTP request") }
              req.Header.Set("Content-Encoding", "gzip")
              req.Header.Set("Content-Type", "application/json")
              resp, err := s.httpClient.Do(req)
              if err != nil { return errors.Wrap(err, "send HTTP batch") }
              defer resp.Body.Close()
              // Bound diagnostic bodies; do not let a failing peer exhaust memory.
              if resp.StatusCode/100 != 2 {
                  body, readErr := io.ReadAll(io.LimitReader(resp.Body, 64*1024))
                  if readErr != nil { return errors.Wrap(readErr, "read HTTP error response") }
                  return fmt.Errorf("HTTP batch returned status %d: %s", resp.StatusCode, body)
              }
              // Drain small successful responses for connection reuse, but always close.
              _, err = io.Copy(io.Discard, io.LimitReader(resp.Body, 64*1024))
              return errors.Wrap(err, "read HTTP response")
          }
          '''
          p.write_text(s)
          p = Path('internal/senders/elasticsearch.go')
          s = p.read_text()
          old = 'return []byte("{\\"index\\": {\\"_index\\": \\"' # replaced below by full return-line selection
          lines = s.splitlines()
          matched = [i for i, line in enumerate(lines) if 'return []byte(' in line and '+ index +' in line]
          assert len(matched) == 1
          lines[matched[0]] = '''    metadata, err := utils.JSON.Marshal(map[string]interface{}{
                  "index": map[string]string{"_index": index, "_type": "logs"},
              })
              if err != nil { return nil, errors.Wrap(err, "encode bulk metadata") }
              return append(metadata, '\\n'), nil'''
          s = '\n'.join(lines) + '\n'
          s = s.replace('s.logger.Warn("try to generate bulk index", zap.Error(err))\n\t\t\tcontinue', 'return errors.Wrap(err, "prepare bulk index")')
          s = s.replace('s.logger.Warn("try to marshal messages", zap.Error(err))\n\t\t\tcontinue', 'return errors.Wrap(err, "marshal bulk message")')
          assert 'try to generate bulk index' not in s
          assert 'try to marshal messages' not in s
          s = s.replace('bulkCtx.buf.Reset()\n\tbulkCtx.gzWriter.Reset(bulkCtx.buf)', 'bulkCtx.reset()')
          s = s.replace('bulkCtx.gzWriter.Close()', 'if err = bulkCtx.gzWriter.Close(); err != nil { return errors.Wrap(err, "finish gzip bulk batch") }')
          begin = s.index('func (s *ElasticSearchSender) checkResp(')
          end = s.index('func (s *ElasticSearchSender) Spawn(', begin)
          s = s[:begin] + '''func (s *ElasticSearchSender) checkResp(resp *http.Response) error {
              body, err := ioutil.ReadAll(resp.Body)
              if err != nil { return errors.Wrap(err, "read Elasticsearch response") }
              if !isStatusCodeOk(resp.StatusCode) { return fmt.Errorf("Elasticsearch returned status %d: %s", resp.StatusCode, body) }
              // A missing result is not evidence of successful delivery. Keep accepting
              // filter_path=errors responses, but require an explicit boolean result.
              var result struct { Errors *bool `json:"errors"` }
              if err = utils.JSON.Unmarshal(body, &result); err != nil { return errors.Wrap(err, "decode Elasticsearch response") }
              if result.Errors == nil { return fmt.Errorf("Elasticsearch response is missing the errors result") }
              if *result.Errors { return fmt.Errorf("Elasticsearch rejected one or more bulk items: %s", body) }
              return nil
          }

          ''' + s[end:]
          p.write_text(s)
          PY
          gofmt -w library/fluentd.go internal/senders/bulk.go internal/senders/httpforward.go internal/senders/elasticsearch.go
      - name: Regression tests and race detector
        run: |
          go test -mod=readonly -count=1 -v -run TestRegression ./internal/senders ./library
          go test -mod=readonly -race -count=10 -timeout=120s -run TestRegression ./internal/senders ./library
      - name: Commit tested fixes
        run: |
          git config user.name 'Laisky'
          git config user.email 'public@laisky.com'
          git add library/fluentd.go internal/senders/bulk.go internal/senders/httpforward.go internal/senders/elasticsearch.go
          git diff --cached --check
          git commit -m 'fix: preserve batched records and reject failed downstream deliveries'
          git push origin HEAD:refs/heads/fix/go127-reliability
          git rev-parse HEAD
      - name: Full repository tests
        run: go test -mod=readonly -count=1 -timeout=120s ./...
      - name: Full repository race detector
        if: always()
        run: go test -mod=readonly -race -count=1 -timeout=120s ./...
