name: Journal writer baseline
on:
  push:
    branches: [perf/durable-group-commit-20260923]
    paths: [.github/workflows/group-stage1.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - name: Reconstruct the exact locally validated refactor and contracts
        env:
          PATCH: 
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,os,subprocess
          # Correct transcription of the transport-only payload is verified
          # before any file is changed. No production checksum is hand-written.
          encoded=os.environ['PATCH'].replace('GoLEJE1j9UIxazx4FEeT3M+vvZdxJZPybTGjbsGZn0FyD0Fy','GoLEJE1j9UIxazx4FEeT3M+vvZdxJZPybTGjbsGZn0RD0Fy').replace('w7vburpgpgC','w7vburpgpC')
          patch=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='f73ad66c082f8924c8c8e0f9b668bded9d5299c3d5c5f2c3ffe1b4a62340b93d'
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply','--index'],input=patch,check=True)
          PY
      - name: Require unchanged-policy behavior and race controls
        run: |
          go mod verify
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 -timeout=180s ./...
          go test -mod=readonly -race -count=5 -shuffle=on -timeout=180s -run TestJournalWriter ./internal/controller
          go test -mod=readonly -run '^$' -bench '^BenchmarkJournalDurableService' -benchtime=2048x -count=1 ./internal/controller > "$RUNNER_TEMP/group-baseline.txt"
      - name: Commit and push tested baseline without force
        run: |
          test "$(git ls-remote origin refs/heads/perf/durable-group-commit-20260923 | cut -f1)" = "${{ github.sha }}"
          git -c user.name=Laisky -c user.email=public@laisky.com commit -m 'test(journal): isolate per-record writer and verify durable receipt contracts'
          git push origin HEAD:refs/heads/perf/durable-group-commit-20260923
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: group-baseline
          path: ${{ runner.temp }}/group-baseline.txt
          retention-days: 14
