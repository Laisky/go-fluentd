name: MessagePack compatibility diagnosis
on:
  push:
    branches: [ci/otlp-routing-source-20260924]
    paths: [.github/workflows/msgp-compatibility.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 13b0bb767e72b8691ae5761e1399ad39975a0610
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Resolve a targeted released fix and record the graph
        run: |
          set -eu
          mkdir -p /tmp/msgp-compat
          go version > /tmp/msgp-compat/go.txt
          go list -m all > /tmp/msgp-compat/before.txt
          go get github.com/tinylib/msgp@v1.1.9
          go mod tidy
          go list -m all > /tmp/msgp-compat/after.txt
          go mod download
          go mod verify > /tmp/msgp-compat/verify.txt
          cp go.mod go.sum /tmp/msgp-compat/
          git diff -- go.mod go.sum > /tmp/msgp-compat/dependencies.patch
          tar -czf /tmp/msgp-compat/modules.tar.gz -C "$(go env GOMODCACHE)" --exclude='golang.org/toolchain*' .
      - name: Native application, race and low-GC regression
        run: |
          set -eu
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 -timeout=180s -json ./... > /tmp/msgp-compat/full.jsonl
          go test -mod=readonly -race -count=3 -shuffle=on -timeout=180s -json ./... > /tmp/msgp-compat/race.jsonl
          GOGC=10 go test -mod=readonly -race -count=1000 -timeout=120s -run '^TestRegressionFluentConcurrentTagRouting$' -json ./internal/senders > /tmp/msgp-compat/gc-routing.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: msgp-compatibility
          path: /tmp/msgp-compat
          retention-days: 7
