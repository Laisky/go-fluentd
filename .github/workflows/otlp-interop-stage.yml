name: Verify exact OTLP interoperability candidate
on:
  push:
    branches: [ci/otlp-gc-interop-20260925]
    paths: [.github/workflows/otlp-interop-stage.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GORACE: 'halt_on_error=1 exitcode=66'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c608b41c6952d8f2a34e84df02a69c4a182dff50
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Verify exact reconciled source and retain current dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/interop-current
          test "$(git rev-parse HEAD)" = c608b41c6952d8f2a34e84df02a69c4a182dff50
          test "$(git rev-parse HEAD^{tree})" = 251b6ae806a06c07cf7b40465b27ab0ebf4fb3e0
          git rev-parse HEAD HEAD^{tree} > /tmp/interop-current/source.txt
          git archive --format=zip HEAD > /tmp/interop-current/source.zip
          cp go.mod go.sum /tmp/interop-current/
          sha256sum go.mod go.sum library/fluentd_gc_test.go tests/otlp_collector/run.py tests/otlp_service/run.py .github/workflows/go.yml internal/senders/fluentd_reliability_test.go > /tmp/interop-current/source-hashes.txt
          go version > /tmp/interop-current/toolchain.txt
          go mod download github.com/tinylib/msgp github.com/philhofer/fwd
          tar -czf /tmp/interop-current/current-module-cache.tar.gz -C "$(go env GOMODCACHE)" cache/download/github.com/tinylib/msgp cache/download/github.com/philhofer/fwd
          go mod verify > /tmp/interop-current/verify.txt
          git diff --exit-code -- go.mod go.sum
      - name: Native build and complete behavior acceptance
        run: |
          set -euo pipefail
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 -timeout=180s -json ./... > /tmp/interop-current/full.jsonl
          go test -mod=readonly -race -count=3 -shuffle=on -timeout=180s -json ./... > /tmp/interop-current/race.jsonl
          GOGC=10 go test -mod=readonly -race -count=20 -timeout=90s -json -run '^TestRegressionFluentDecodeStringLifetime$' ./library > /tmp/interop-current/decoder.jsonl
          GOGC=10 go test -mod=readonly -race -count=1000 -timeout=180s -json -run '^TestRegressionFluent(ConcurrentTagRouting|WireOracleRejectsWrongRoute)$' ./internal/senders > /tmp/interop-current/routing.jsonl
          test -z "$(gofmt -l library/fluentd_gc_test.go)"
          python3 .scripts/check_readme.py --static
          python3 - <<'PY'
          import json,pathlib,collections
          root=pathlib.Path('/tmp/interop-current')
          empty={'gofluentd','gofluentd/cmd','gofluentd/internal/global','gofluentd/library/config','gofluentd/library/log'}
          def validate(rows,count):
              assert not any(x['Action']=='fail' or (x['Action']=='skip' and 'Test' in x) for x in rows),'failed or skipped test'
              for x in rows:
                  if x['Action']=='skip':
                      pkg=x['Package']
                      assert pkg in empty,('unexpected package skip',pkg)
                      assert any(r.get('Package')==pkg and '[no test files]' in r.get('Output','') for r in rows),('missing no-test evidence',pkg)
              assert sum(x['Action']=='pass' and 'Test' in x for x in rows)==count,'pass count'
              assert sum(x['Action']=='run' and 'Test' in x for x in rows)==count,'run count'
          result={}
          for name,count in [('full',750),('race',2250),('decoder',20),('routing',2000)]:
              rows=[json.loads(x) for x in (root/(name+'.jsonl')).read_text().splitlines()]
              validate(rows,count)
              if name=='routing':
                  counts=collections.Counter(x.get('Test') for x in rows if x['Action']=='pass' and 'Test' in x)
                  assert counts=={'TestRegressionFluentConcurrentTagRouting':1000,'TestRegressionFluentWireOracleRejectsWrongRoute':1000},counts
              for action in ['skip','fail']:
                  try:
                      validate(rows+[{'Action':action,'Package':'gofluentd/library','Test':'TestInjected'}],count)
                  except AssertionError as exc:
                      assert str(exc)=='failed or skipped test'
                  else:
                      raise AssertionError('validator accepted '+action)
              result[name]={'passes':count,'real_failure_and_skipped_test_controls':'rejected'}
          (root/'test-summary.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - name: Real pinned Collector source and sink acceptance
        run: |
          set -euo pipefail
          mkdir -p /tmp/collector-dist
          curl --fail --location --retry 3 https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.161.0/otelcol_0.161.0_linux_amd64.tar.gz -o /tmp/collector-dist/collector.tar.gz
          echo '6c2af0731a53691e3771d82a4b71e2941a46de27af191e40c697b6ed8643e50e  /tmp/collector-dist/collector.tar.gz' | sha256sum --check
          tar -xzf /tmp/collector-dist/collector.tar.gz -C /tmp/collector-dist otelcol
          go build -mod=readonly -race -o /tmp/go-fluentd-collector .
          go version -m /tmp/go-fluentd-collector > /tmp/interop-current/binary-build.txt
          python3 tests/otlp_collector/run.py --binary /tmp/go-fluentd-collector --collector /tmp/collector-dist/otelcol --artifacts /tmp/interop-current/campaign | tee /tmp/interop-current/campaign.log
          python3 tests/otlp_collector/run.py --audit-only --artifacts /tmp/interop-current/campaign > /tmp/interop-current/saved-audit.json
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: otlp-interop-reconciled-candidate
          path: /tmp/interop-current
          if-no-files-found: error
          retention-days: 14
