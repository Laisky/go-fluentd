name: Validate event format increment
on:
  push:
    branches: [ci/publish-stream-formats-20260924]
    paths: [.audit/finish-events.json]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Reconstruct exactly the validated candidate
        shell: bash
        run: |
          set -euo pipefail
          cp .audit/finish-events.json /tmp/event-step.json
          python3 - <<'PY'
          import json,base64,zlib,hashlib,pathlib,re,subprocess
          m=json.load(open('/tmp/event-step.json'))
          assert re.fullmatch('[a-f0-9]{40}',m['parent']) and re.fullmatch('[a-f0-9]{40}',m['tree'])
          assert re.fullmatch('ci/event-stage-[0-9]+-20260924',m['branch'])
          patch=zlib.decompress(base64.b64decode(m['patch'],validate=True))
          assert hashlib.sha256(patch).hexdigest()==m['sha256']
          pathlib.Path('/tmp/event-step.patch').write_bytes(patch)
          subprocess.run(['git','checkout','--detach',m['parent']],check=True)
          subprocess.run(['git','apply','--index','/tmp/event-step.patch'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==m['tree']
          PY
      - name: Native module and application validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/event-validation
          go version | tee /tmp/event-validation/go.txt
          go mod verify | tee /tmp/event-validation/modules.txt
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 -timeout=180s -json ./... > /tmp/event-validation/full.jsonl
          go test -mod=readonly -race -count=3 -shuffle=on -timeout=180s -json ./... > /tmp/event-validation/race.jsonl
          git diff --exit-code -- go.mod go.sum
          git diff --cached --check
      - name: Stage commit without touching master or the pull request branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Laisky.Cai'
          git config user.email 'github@laisky.com'
          message=$(python3 -c "import json;print(json.load(open('/tmp/event-step.json'))['message'])")
          branch=$(python3 -c "import json;print(json.load(open('/tmp/event-step.json'))['branch'])")
          git commit -m "$message"
          git rev-parse HEAD | tee /tmp/event-validation/head.txt
          git rev-parse HEAD^{tree} > /tmp/event-validation/tree.txt
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: event-increment-validation
          path: /tmp/event-validation
          retention-days: 7
