name: Fluent ingress red-green validation

on:
  push:
    branches: [codex/fix-fluent-ingress-budgets]

permissions:
  contents: write

jobs:
  validate:
    if: github.ref == 'refs/heads/codex/fix-fluent-ingress-budgets'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - name: Reproduce the original production-path failure safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fluent-ingress-evidence
          go version | tee /tmp/fluent-ingress-evidence/toolchain.txt
          git worktree add --detach /tmp/fluent-ingress-before bdc874d6591664d0538c6fe974f11079b255de1e
          cp internal/recvs/fluent_ingress_regression_test.go /tmp/fluent-ingress-before/internal/recvs/
          set +e
          (cd /tmp/fluent-ingress-before && go test -mod=readonly -count=1 -timeout=60s -run '^TestFluentIngressRejectsOuterHeaderBeforeBody$' ./internal/recvs) > /tmp/fluent-ingress-evidence/before.txt 2>&1
          status=$?
          set -e
          cat /tmp/fluent-ingress-evidence/before.txt
          test "$status" -ne 0
          grep -q 'FLUENT_PREVALIDATION_REGRESSION: waited for body' /tmp/fluent-ingress-evidence/before.txt
      - name: Integrate guarded receiver and settings changes
        run: |
          python3 .scripts/apply_fluent_ingress_fix.py
          gofmt -w internal/recvs/fluentwire/*.go internal/recvs/fluent_ingress*.go internal/recvs/fluentd.go internal/controller/fluent_ingress.go internal/controller/controllor.go
          git diff --check
          git diff > /tmp/fluent-ingress-evidence/integration.diff
      - name: Build, vet, full behavior tests and coverage floors
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 -timeout=180s -coverprofile=/tmp/fluent-ingress-evidence/coverage.out ./... 2>&1 | tee /tmp/fluent-ingress-evidence/tests.txt
          python3 .scripts/check_component_coverage.py /tmp/fluent-ingress-evidence/coverage.out
      - name: Receiver repetition and full-suite race validation
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=readonly -race -count=10 -shuffle=on -timeout=180s ./internal/recvs/... 2>&1 | tee /tmp/fluent-ingress-evidence/receiver-race.txt
          go test -mod=readonly -race -count=1 -shuffle=on -timeout=180s ./... 2>&1 | tee /tmp/fluent-ingress-evidence/full-race.txt
      - name: Bounded fuzzing and allocation benchmarks
        shell: bash
        run: |
          set -euo pipefail
          GOMAXPROCS=2 go test ./internal/recvs/fluentwire -run '^$' -fuzz '^FuzzReadFrame$' -fuzztime=30s 2>&1 | tee /tmp/fluent-ingress-evidence/fuzz.txt
          go test ./internal/recvs/fluentwire -run '^$' -bench . -benchmem 2>&1 | tee /tmp/fluent-ingress-evidence/benchmarks.txt
          git diff --exit-code -- go.mod go.sum
      - name: Commit verified integration and remove one-shot workflow
        run: |
          rm .github/workflows/fluent-ingress-validation.yml .scripts/apply_fluent_ingress_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/recvs internal/controller docs/fluent-ingress-limits.md .github/workflows/fluent-ingress-validation.yml .scripts/apply_fluent_ingress_fix.py
          git commit -m 'fix: enforce and verify Fluent ingress resource budgets'
          git push origin HEAD:codex/fix-fluent-ingress-budgets
          git rev-parse HEAD > /tmp/fluent-ingress-evidence/verified-commit.txt
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fluent-ingress-red-green-evidence
          path: /tmp/fluent-ingress-evidence
          retention-days: 14
