name: Locked OTLP dependency cache
on:
  push:
    branches: [ci/otlp-native-20260924]
    paths: [.github/workflows/otlp-locked-cache.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4407a25e5fc82a21716c07bbc961681a787ad332
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Download and verify unchanged native graph
        run: |
          set -euo pipefail
          mkdir -p /tmp/locked-otlp
          go mod download -json > /tmp/locked-otlp/modules.jsonl
          go mod verify | tee /tmp/locked-otlp/verify.txt
          git diff --exit-code -- go.mod go.sum
          cp go.mod go.sum /tmp/locked-otlp/
          python3 - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path('/tmp/locked-otlp')
          raw=(root/'modules.jsonl').read_text(); dec=json.JSONDecoder(); records=[]
          while raw.strip():
              m,n=dec.raw_decode(raw.lstrip()); raw=raw.lstrip()[n:]
              assert not m.get('Error'), m
              i=len(records)
              for key in ('Zip','GoMod','Info'):
                  if key in m:
                      target=f'{i}-{key}'
                      shutil.copyfile(m[key],root/target)
                      m[key]=target
              records.append(m)
          (root/'manifest.json').write_text(json.dumps(records))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: locked-otlp-dependencies
          path: /tmp/locked-otlp
          retention-days: 3
