name: Go

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
      - run: go version
      - run: go mod verify
      - run: go build -mod=readonly ./...
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly -count=1 -timeout=180s ./...
      - name: Race detection with shuffled, repeated behavior tests
        run: go test -mod=readonly -race -shuffle=on -count=10 -timeout=180s ./...
      - name: Measure statement coverage
        run: go test -mod=readonly -race -covermode=atomic -coverprofile=coverage.out -count=1 -timeout=180s ./...
      - name: Enforce whole-profile and component coverage floors
        run: |
          python3 -m unittest discover -s .scripts -p 'test_*.py'
          python3 .scripts/check_coverage.py coverage.out
          go tool cover -func=coverage.out
      - name: Fuzz Fluent message round trips
        run: go test -mod=readonly ./library -run '^$' -fuzz '^FuzzBehaviorFluentMessageRoundTrip$' -fuzztime=5s -parallel=2
      - name: Fuzz template literal handling
        run: go test -mod=readonly ./library -run '^$' -fuzz '^FuzzBehaviorTemplateLiteralSafety$' -fuzztime=5s -parallel=2
      - name: Fuzz Kafka JSON decoding
        run: go test -mod=readonly ./internal/recvs -run '^$' -fuzz '^FuzzBehaviorKafkaJSONObject$' -fuzztime=5s -parallel=2
      - run: git diff --exit-code -- go.mod go.sum

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and smoke-test the runtime image
        run: |
          docker build -f .docker/Dockerfile -t go-fluentd:ci .
          docker run --rm go-fluentd:ci --help
      - name: Run the test image
        run: |
          docker build -f .docker/test.Dockerfile -t go-fluentd-test:ci .
          docker run --rm go-fluentd-test:ci
      - name: Validate the legacy forward Go build stage
        run: docker build --target gobin -f .docker/forward.Dockerfile -t go-fluentd-forward-build:ci .
