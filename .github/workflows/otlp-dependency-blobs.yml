name: Materialize verified dependency blobs
on:
  push:
    branches: [ci/otlp-gc-interop-20260925]
    paths: [.github/workflows/otlp-dependency-blobs.yml]
permissions:
  contents: write
jobs:
  blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 13b0bb767e72b8691ae5761e1399ad39975a0610
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Generate and verify exact already-tested module files
        run: |
          set -euo pipefail
          go get github.com/tinylib/msgp@v1.1.4
          go mod verify
          test "$(git hash-object go.mod)" = f12d832bea461a19284bbba7338e2de10b612599
          test "$(git hash-object go.sum)" = 21b6381a686e7b64fdce6529e4fcd3ac83017ec0
          mkdir -p /tmp/dependency-blobs
          cp go.mod go.sum /tmp/dependency-blobs/
      - name: Store only verified blobs; no branch or pull-request mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, pathlib, subprocess
          expected={'go.mod':'f12d832bea461a19284bbba7338e2de10b612599','go.sum':'21b6381a686e7b64fdce6529e4fcd3ac83017ec0'}
          results={}
          for name, sha in expected.items():
              payload=json.dumps({'encoding':'base64','content':base64.b64encode(pathlib.Path(name).read_bytes()).decode()})
              result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/Laisky/go-fluentd/git/blobs','--input','-'],input=payload,text=True))
              assert result['sha']==sha, result
              results[name]=result['sha']
          pathlib.Path('/tmp/dependency-blobs/blobs.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verified-dependency-blobs
          path: /tmp/dependency-blobs
          retention-days: 7
