name: Dependency upgrade verification

on:
  push:
    branches: [chore/dependencies-20260928]
    paths: ['.github/workflows/dependency-upgrade.yml']

permissions:
  contents: read

concurrency:
  group: dependency-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    if: github.repository == 'Laisky/go-fluentd' && github.ref == 'refs/heads/chore/dependencies-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - name: Record baseline dependency graph
        run: |
          mkdir -p /tmp/dependency-upgrade
          go version
          cp go.mod /tmp/dependency-upgrade/before.mod
          go list -m -json all > /tmp/dependency-upgrade/before.json
      - name: Adopt the merged go-journal optimization
        run: |
          go get github.com/Laisky/go-journal@ad049272dbeafca55f2e0a987942504ab127d3c0
          go mod tidy
          go mod verify
      - name: Save resolved journal module and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- go.mod go.sum; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add go.mod go.sum
            git commit -m 'chore(deps): adopt merged go-journal performance and correctness fixes'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/chore/dependencies-20260928
          fi
      - name: Resolve latest compatible module-path versions
        id: resolve
        run: |
          set -o pipefail
          go get -u -t ./... 2>&1 | tee /tmp/dependency-upgrade/upgrade.log
          go mod tidy
          go mod verify
      - name: Save resolved dependency graph and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- go.mod go.sum; then
            git add go.mod go.sum
            git commit -m 'chore(deps): refresh direct and transitive Go dependencies'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/chore/dependencies-20260928
          fi
      - name: Build and vet
        run: |
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
      - name: Behavior tests
        run: go test -mod=readonly -count=1 -timeout=180s ./...
      - name: Race and ordering checks
        run: go test -mod=readonly -race -count=3 -shuffle=on -timeout=180s ./...
      - name: Record final state
        if: always()
        run: |
          cp go.mod go.sum /tmp/dependency-upgrade/
          git rev-parse HEAD > /tmp/dependency-upgrade/commit.txt
          go list -m -u -json all > /tmp/dependency-upgrade/after.json || true
          git diff -- go.mod go.sum
      - name: Retain upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-upgrade-evidence
          path: /tmp/dependency-upgrade
          retention-days: 14
          if-no-files-found: error
