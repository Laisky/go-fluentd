name: Component verification and publication
on:
  push:
    branches: [test/component-behavior-coverage]
    paths: [.github/workflows/component-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Import checksum-verified source commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, json, base64, hashlib, lzma
          from pathlib import Path
          shas = ['aaee6cbfc73e0c119378fadf0ee18a42e1053190', 'e04e30e7b2ca0d2928c3480d38d8c1f28a7d6f88', '30922401d149eb766499040e6fbc295b77b229bc', '7627ad8cf188c36697211208c41764581af9f946', 'a6fc79faeef29570a2a07c13150d29970d2a1373']
          chunks = []
          for sha in shas:
              req = urllib.request.Request('https://api.github.com/repos/Laisky/go-fluentd/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'component-verification'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  value = json.load(response)
              data = base64.b64decode(value['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              chunks.append(data)
          packed = b''.join(chunks)
          assert len(packed) == 47412
          assert hashlib.sha256(packed).hexdigest() == '4c09d00e38c58a3e82ce095441a74fb9d7d09755ee3fe91808d6734b9650fe22'
          patch = lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == 'c4dc077b86627a36b40dccfc14a4d90b67f0d2dc9031274605f97130512ff222'
          Path('/tmp/components.patch').write_bytes(patch)
          print('Verified complete patch bytes:', len(patch))
          PY
          git config user.name 'Assistant'
          git config user.email 'assistant@localhost'
          git am /tmp/components.patch
          git diff '${{ github.sha }}' --check
          git diff --exit-code '${{ github.sha }}' -- go.mod go.sum .github/workflows
      - name: Verify fail-first controls on the first test-only commit
        run: |
          first=$(git rev-list --reverse '${{ github.sha }}'..HEAD | head -1)
          git worktree add --detach /tmp/component-red "$first"
          python3 - <<'PY'
          import json, subprocess
          p = subprocess.run(['go', 'test', '-mod=readonly', '-json', '-count=1', '-timeout=30s', '-run', 'TestBehaviorMessageTemplates|TestBehaviorTemplateMissingValuesDoNotReusePreviousValue|TestBehaviorMapAndRegexUtilities', './library'], cwd='/tmp/component-red', text=True, capture_output=True)
          print(p.stdout); print(p.stderr)
          events = [json.loads(line) for line in p.stdout.splitlines() if line.startswith('{')]
          failed = {e.get('Test') for e in events if e.get('Action') == 'fail'}
          passed = {e.get('Test') for e in events if e.get('Action') == 'pass'}
          assert p.returncode != 0
          assert {'TestBehaviorMessageTemplates', 'TestBehaviorTemplateMissingValuesDoNotReusePreviousValue'} <= failed
          assert 'TestBehaviorMapAndRegexUtilities' in passed
          PY
          git worktree remove /tmp/component-red
      - name: Verify complete repaired source
        run: |
          go version
          go mod verify
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 -timeout=180s ./...
          go test -mod=readonly -race -shuffle=on -count=10 -timeout=180s ./...
          go test -mod=readonly -race -covermode=atomic -coverprofile=/tmp/components.cover -count=1 -timeout=180s ./...
          python3 .scripts/check_coverage.py /tmp/components.cover
          python3 -m unittest discover -s .scripts -p 'test_*.py'
          go test -mod=readonly ./library -run '^$' -fuzz '^FuzzBehaviorFluentMessageRoundTrip$' -fuzztime=5s -parallel=2
          go test -mod=readonly ./library -run '^$' -fuzz '^FuzzBehaviorTemplateLiteralSafety$' -fuzztime=5s -parallel=2
          go test -mod=readonly ./internal/recvs -run '^$' -fuzz '^FuzzBehaviorKafkaJSONObject$' -fuzztime=5s -parallel=2
          git diff --exit-code -- go.mod go.sum
      - name: Publish verified commits without replacing concurrent changes
        run: |
          git push origin HEAD:refs/heads/test/component-behavior-coverage
          git log --oneline -9
          git rev-parse HEAD HEAD^{tree}
