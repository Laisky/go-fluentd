name: Dependency upgrade verification

on:
  push:
    branches: [chore/dependencies-20260928]
    paths: ['.github/workflows/dependency-upgrade.yml']

permissions:
  contents: read

concurrency:
  group: dependency-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    if: github.repository == 'Laisky/go-fluentd' && github.ref == 'refs/heads/chore/dependencies-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - name: Refresh dependency introduced by the compatible go-utils version
        run: |
          mkdir -p /tmp/dependency-upgrade
          go get github.com/form3tech-oss/jwt-go@v3.2.5+incompatible
          gofmt -w internal/recvs/kafka_broker_test.go
          go mod tidy
          go mod verify
      - name: Commit final resolved module files and test formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add go.mod go.sum internal/recvs/kafka_broker_test.go
            git commit -m 'chore(deps): update transitive JWT to 3.2.5 and format broker regression tests'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/chore/dependencies-20260928
          fi
      - name: Verify dependency resolution and build
        run: |
          set -o pipefail
          go build -mod=readonly ./... 2>&1 | tee /tmp/dependency-upgrade/build.log
          go vet -mod=readonly ./... 2>&1 | tee /tmp/dependency-upgrade/vet.log
          go test -mod=readonly -count=1 -timeout=180s ./... 2>&1 | tee /tmp/dependency-upgrade/tests.log
          git diff --exit-code -- go.mod go.sum
      - name: Record active and complete dependency graphs
        if: always()
        run: |
          mkdir -p /tmp/dependency-upgrade
          cp go.mod go.sum /tmp/dependency-upgrade/
          git rev-parse HEAD > /tmp/dependency-upgrade/commit.txt
          git archive --format=tar.gz HEAD > /tmp/dependency-upgrade/source.tar.gz
          go list -mod=readonly -deps -test -f '{{if .Module}}{{.Module.Path}}{{end}}' ./... | sort -u > /tmp/dependency-upgrade/active-modules.txt
          go list -m -u -json all > /tmp/dependency-upgrade/after.json
      - name: Retain upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-upgrade-evidence
          path: /tmp/dependency-upgrade
          retention-days: 14
          if-no-files-found: error
