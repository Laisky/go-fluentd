name: Group review workspace
on:
  push:
    branches: [chore/group-review-workspace-20260923]
    paths: [.github/workflows/group-review-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - name: Capture source and current journal module
        run: |
          mkdir /tmp/group-review
          git bundle create /tmp/group-review/app.bundle --all
          go mod download github.com/Laisky/go-journal
          go mod download -json github.com/Laisky/go-journal > /tmp/group-review/journal-module.json
          d=$(go list -m -f '{{.Dir}}' github.com/Laisky/go-journal)
          tar -czf /tmp/group-review/journal-module.tar.gz -C "$d" .
          go version > /tmp/group-review/toolchain.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: group-review-workspace
          path: /tmp/group-review/
          retention-days: 3
