name: Delivery contracts

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GORACE: 'halt_on_error=1 exitcode=66'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  executable:
    name: External delivery (seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        seed: [127, 991]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
      - run: go version
      - name: Build the ordinary executable with race instrumentation
        run: go build -mod=readonly -race -o "$RUNNER_TEMP/go-fluentd-delivery" .
      - name: Verify real ingress, persistence, process crashes and downstream ledgers
        env:
          DELIVERY_TEST_SEED: ${{ matrix.seed }}
        run: |
          python3 tests/delivery/run.py --binary "$RUNNER_TEMP/go-fluentd-delivery" \
            --artifacts "$RUNNER_TEMP/delivery-results" --seed "$DELIVERY_TEST_SEED"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'delivery-results/results.json').read_text())
          assert result['passed'] and result['run']==result['expected']==27,result
          PY
          git diff --exit-code -- go.mod go.sum
      - name: Retain independent producer and sink evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-seed-${{ matrix.seed }}
          path: ${{ runner.temp }}/delivery-results
          retention-days: 14
          if-no-files-found: error

  negative-controls:
    name: Old executable failures and positive controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
      - name: Build both exact executable versions
        run: |
          go build -mod=readonly -race -o "$RUNNER_TEMP/go-fluentd-after" .
          git worktree add --detach "$RUNNER_TEMP/delivery-before" dc768b2ec84625f71bc9119fa20641d0673160c3
          (cd "$RUNNER_TEMP/delivery-before" && go build -mod=readonly -o "$RUNNER_TEMP/go-fluentd-before" .)
      - name: Require three named old failures and two controls passing both versions
        run: |
          python3 .scripts/verify_delivery_regressions.py \
            --before "$RUNNER_TEMP/go-fluentd-before" --after "$RUNNER_TEMP/go-fluentd-after" \
            --artifacts "$RUNNER_TEMP/delivery-contrast"
      - name: Retain assertion-level red/green evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-red-green
          path: ${{ runner.temp }}/delivery-contrast
          retention-days: 14
          if-no-files-found: error
