name: Journal performance integration
on:
  push:
    branches: [perf/measured-pipeline-20260923]
    paths: [.github/workflows/perf-integrate.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - name: Pin exact reviewed journal source through Go tooling
        run: |
          go get github.com/Laisky/go-journal@decb710e48ae4ec6148c555199e8e85cccd587a1
          go mod verify
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          python3 -m unittest discover -s tests/performance -p 'test_*.py'
          go test -mod=readonly -count=1 -timeout=180s ./...
          go test -mod=readonly -race -count=5 -shuffle=on -timeout=180s ./...
      - name: Verify executable-level reliability before integration commit
        run: |
          go build -mod=readonly -race -o /tmp/go-fluentd-delivery .
          GORACE='halt_on_error=1 exitcode=66' python3 tests/delivery/run.py --binary /tmp/go-fluentd-delivery --artifacts /tmp/perf-delivery --seed 127
      - name: Publish verified module pin and Go-generated checksums
        run: |
          git config user.name Laisky
          git config user.email public@laisky.com
          git add go.mod go.sum
          git commit -m 'build(perf): pin measured journal optimizations after full delivery verification'
          git push origin HEAD:refs/heads/perf/measured-pipeline-20260923
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: performance-integration-delivery
          path: /tmp/perf-delivery/
          retention-days: 14
