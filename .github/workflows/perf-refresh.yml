name: Adaptive journal integration
on:
  push:
    branches: [perf/measured-pipeline-20260923]
    paths: [.github/workflows/perf-refresh.yml]
permissions:
  contents: write
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - name: Preserve the full unfavorable first paired campaign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Laisky/go-fluentd/actions/artifacts/10748675514/zip > /tmp/first-campaign.zip
          echo '25357327e060f696c429742738f6167dec65915ed5032987296397ea5aafdda9  /tmp/first-campaign.zip' | sha256sum -c -
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          z=zipfile.ZipFile('/tmp/first-campaign.zip')
          dest=Path('tests/performance/results/20260923-fixed64k');dest.mkdir(parents=True,exist_ok=False)
          summary=json.loads(z.read('components/summary.json'));assert len(summary)==35
          (dest/'components.jsonl').write_text(''.join(json.dumps({'name':k,**v},separators=(',',':'))+'\n' for k,v in sorted(summary.items())))
          for name in ['environment.txt','components/manifest.json','components/summary.md','recovery-before-alloc-top.txt','recovery-after-alloc-top.txt']:
              (dest/Path(name).name).write_bytes(z.read(name))
          raw=[]
          for name in sorted(z.namelist()):
              if name.startswith('components/') and name.endswith('.txt'):
                  raw.append('\n# '+name+'\n'+z.read(name).decode())
          (dest/'raw-benchmarks.txt').write_text(''.join(raw))
          runs={name:json.loads(z.read(name)) for name in z.namelist() if name.startswith('pipeline-') and name.endswith('/pipeline.json')}
          assert len(runs)==6
          assert all(len(run['samples'])==4 for run in runs.values())
          assert all(s['accepted']==1024 and s['delivered_per_sink']==[1024,1024] for run in runs.values() for s in run['samples'])
          (dest/'pipeline.json').write_text(json.dumps(runs,separators=(',',':'))+'\n')
          (dest/'README.md').write_text('# Superseded fixed-64-KiB candidate\n\nSource/harness head `bba31596b73331c6fa0af7e7ba2fcc799130d241`, measured merge `39058705434957b4654df723b19c56d4c15427cc`. Hosted run: https://github.com/Laisky/go-fluentd/actions/runs/35858164130 .\n\nAll 35 workloads and 24 full-process samples are retained. The 4,096-record plain recovery scan regressed 14.7% with non-overlapping observed ranges, so the universal 64 KiB data-reader policy was superseded by adaptive read-ahead. These results are not the final candidate. Other unchanged or slower cases, including noisy whole-pipeline timing, have not been removed.\n')
          PY
      - name: Pin the corrected journal through Go tooling and validate
        run: |
          go get github.com/Laisky/go-journal@02361be103609626d7e1cd637f55c2cb1e469fe6
          go mod verify
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          python3 -m unittest discover -s tests/performance -p 'test_*.py'
          go test -mod=readonly -count=1 -timeout=180s ./...
          go test -mod=readonly -race -count=5 -shuffle=on -timeout=180s ./...
      - name: Verify full executable crash and delivery behavior before pinning
        run: |
          go build -mod=readonly -race -o /tmp/go-fluentd-delivery .
          GORACE='halt_on_error=1 exitcode=66' python3 tests/delivery/run.py --binary /tmp/go-fluentd-delivery --artifacts /tmp/adaptive-delivery --seed 991
      - name: Publish only validated dependency and permanent measurement evidence
        run: |
          git config user.name Laisky
          git config user.email public@laisky.com
          git add go.mod go.sum tests/performance/results/20260923-fixed64k
          git commit -m 'perf: integrate adaptive journal read-ahead and retain the rejected paired campaign'
          git push origin HEAD:refs/heads/perf/measured-pipeline-20260923
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: adaptive-journal-delivery
          path: /tmp/adaptive-delivery/
          retention-days: 14
