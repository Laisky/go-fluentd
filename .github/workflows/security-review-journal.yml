name: Journal dependency review workspace
on:
  push:
    branches: [codex/security-review-workspace-20261006]
    paths: [.github/workflows/security-review-journal.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Laisky/go-journal
          ref: ad049272dbeafca55f2e0a987942504ab127d3c0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - name: Prepare public source and test dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/journal-review
          git archive HEAD | tar -x -C /tmp/journal-review
          cd /tmp/journal-review
          cp go.mod go.mod.original
          cp go.sum go.sum.original
          go mod tidy
          go mod vendor
          tar -czf /tmp/journal-review.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: journal-review-source
          path: /tmp/journal-review.tar.gz
          retention-days: 1
          if-no-files-found: error
