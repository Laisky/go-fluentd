name: Publish verified journal dependency update
on:
  push:
    branches: [chore/journal-dependency-preflight-20260924]
    paths: [.github/workflows/journal-dependency-preflight.yml]
permissions:
  contents: read
jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 23260ee7c88c15090414ea376a0c6dc06679d5ba
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Reconstruct exactly the locally tested three-file tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/journal-upgrade-publish
          python3 - <<'PY'
          import hashlib, pathlib
          source = pathlib.Path('internal/controller/journal_dependency_test.go').read_text()
          # Remove the single transcription-only extra brace in the transfer branch.
          needle = '\n\t\t\t\t}\n\t\t\t\t}\n\t\t\t})'
          assert source.count(needle) == 1
          source = source.replace(needle, '\n\t\t\t\t}\n\t\t\t})')
          assert hashlib.sha256(source.encode()).hexdigest() == '70058855b3ecbfca05c4c806caefc1474286f111093030a1b74f65461a964351'
          pathlib.Path('/tmp/journal-upgrade-publish/journal_dependency_test.go').write_text(source)
          PY
          git switch --detach b22cd5479fb1cc67b7d551d8129e24d583967c55
          go get github.com/Laisky/go-journal@612f5354f53854d7d7c57a65d3ca876cc511a653
          go mod tidy
          printf '%s\n' '23dbc2636a01e4b2684c6b9d5c5d3e756fcd55d83b41f1fbba1d05b82eb38280  go.mod' '4a424b8aab920e4fed56abab70ee60d536eb2050ca9c5081ddb1588b2cf85064  go.sum' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum
          git commit -m 'build(deps): update go-journal to merged recovery and append-safety fixes'
          cp /tmp/journal-upgrade-publish/journal_dependency_test.go internal/controller/journal_dependency_test.go
          test -z "$(gofmt -l internal/controller/journal_dependency_test.go)"
          git add internal/controller/journal_dependency_test.go
          test "$(git write-tree)" = a2495e37032e41612ee613499a61ac3832607f4e
      - name: Verify native dependencies and consumer contracts before publication
        shell: bash
        run: |
          set -euo pipefail
          go version | tee /tmp/journal-upgrade-publish/toolchain.txt
          go mod verify
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 -timeout=180s -json ./... > /tmp/journal-upgrade-publish/full.jsonl
          go test -mod=readonly -race -count=5 -shuffle=on -timeout=180s -json ./... > /tmp/journal-upgrade-publish/race.jsonl
          git diff --exit-code -- go.mod go.sum
          git commit -m 'test(journal): retain consumer receipt and recovery regression contracts'
          test "$(git rev-parse HEAD^{tree})" = a2495e37032e41612ee613499a61ac3832607f4e
          git rev-parse HEAD HEAD^{tree} > /tmp/journal-upgrade-publish/source.txt
          git bundle create /tmp/journal-upgrade-publish/source.bundle HEAD
      - name: Publish new branch only, without force or default-branch writes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          ref=refs/heads/build/update-go-journal-20260924
          test -z "$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin "$ref")"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:"$ref"
          unset auth
      - name: Retain native validation and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: journal-dependency-publication
          path: /tmp/journal-upgrade-publish
          retention-days: 7
