name: PR 7 repair verification
on:
  push:
    branches: [test/component-behavior-coverage]
    paths: [.github/workflows/pr7-repair.yml]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 76717b288a170acc0e1e12daf19def9fa7da1bb1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Export unmodified toolchain and verified dependency sources
        run: |
          set -eux
          mkdir -p /tmp/pr7-offline
          go version | tee /tmp/pr7-offline/version.txt
          go mod download
          go mod verify | tee /tmp/pr7-offline/modules.txt
          go mod vendor -o /tmp/pr7-vendor
          tar -czf /tmp/pr7-offline/vendor.tar.gz -C /tmp/pr7-vendor .
          tar -czf /tmp/pr7-offline/toolchain.tar.gz -C "$(go env GOROOT)" .
          git diff --exit-code -- go.mod go.sum
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr7-offline-tests
          path: /tmp/pr7-offline
          if-no-files-found: error
          retention-days: 1
