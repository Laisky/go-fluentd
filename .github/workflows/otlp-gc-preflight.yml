name: OTLP dependency and Collector preflight
on:
  push:
    branches: [ci/otlp-gc-interop-20260925]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Reproduce original decoder and test minimal upstream fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/preflight
          go version > /tmp/preflight/go.txt
          git rev-parse HEAD HEAD^{tree} > /tmp/preflight/source.txt
          go test -mod=readonly -race -count=5 -timeout=60s -run '^TestRegressionFluentDecodeStringLifetime$' ./library > /tmp/preflight/old-decoder.log 2>&1 && old_rc=0 || old_rc=$?
          printf '%s\n' "$old_rc" > /tmp/preflight/old-exit.txt
          go get github.com/tinylib/msgp@v1.1.4
          go mod download
          go mod verify > /tmp/preflight/verify.txt
          cp go.mod go.sum /tmp/preflight/
          git diff -- go.mod go.sum > /tmp/preflight/dependency.diff
          GOGC=10 go test -mod=readonly -race -count=20 -timeout=90s -run '^TestRegressionFluentDecodeStringLifetime$' ./library > /tmp/preflight/new-decoder.log 2>&1
          GOGC=10 go test -mod=readonly -race -count=500 -timeout=90s -run '^TestRegressionFluentConcurrentTagRouting$' ./internal/senders > /tmp/preflight/new-routing.log 2>&1
          go test -mod=readonly -count=1 -timeout=180s -json ./... > /tmp/preflight/full.jsonl
          go list -m -json all > /tmp/preflight/modules.json
          tar -czf /tmp/preflight/modules.tar.gz -C "$(go env GOMODCACHE)" cache/download
      - name: Obtain official pinned Collector and verify published checksum
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/preflight
          url=https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.161.0/otelcol_0.161.0_linux_amd64.tar.gz
          curl --fail --location --retry 3 "$url" -o collector.tar.gz
          curl --fail --location --retry 3 "$url.sha256" -o collector.published.sha256
          digest=$(awk '{print $1}' collector.published.sha256)
          [[ "$digest" =~ ^[[:xdigit:]]{64}$ ]]
          printf '%s  collector.tar.gz\n' "$digest" | sha256sum --check
          curl --fail --location https://api.github.com/repos/open-telemetry/opentelemetry-collector-releases/releases/tags/v0.161.0 -o collector-release.json
          sha256sum collector.tar.gz modules.tar.gz go.mod go.sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: otlp-gc-collector-preflight
          path: /tmp/preflight
          if-no-files-found: error
          retention-days: 7
