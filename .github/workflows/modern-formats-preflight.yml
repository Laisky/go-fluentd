name: Restore complete native dependency
on:
  push:
    branches: [chore/modern-formats-preflight-20260924]
    paths: [.github/workflows/modern-formats-preflight.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - name: Export the original complete module archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/complete-module
          cd /tmp/complete-module
          go mod download -json gonum.org/v1/gonum@v0.17.0 > module.json
          python3 - <<'PY'
          import json, shutil
          meta = json.load(open('module.json'))
          assert not meta.get('Error'), meta
          for key, name in [('Zip','module.zip'),('GoMod','module.mod'),('Info','module.info')]:
              shutil.copyfile(meta[key], name)
          PY
          sha256sum module.* > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete-gonum-native-module
          path: /tmp/complete-module
          retention-days: 3
