name: Validate private delivery fixture
on:
  push:
    branches: [codex/security-final-review-20261006]
    paths: [.github/workflows/security32-fixture-blob.yml]
permissions:
  contents: write
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Apply exact reviewed fixture diff
        run: |
          set -euo pipefail
          git checkout --detach c6a6725087a74af7fb712d6294aae9de63b9e419
          mkdir -p /tmp/fixture-evidence
          python3 - <<'PY'
          import base64, hashlib, pathlib, zlib
          encoded = ''
          PY
