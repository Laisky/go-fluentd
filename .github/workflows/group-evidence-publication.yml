name: Preserve group-commit evidence
on:
  push:
    branches: [chore/group-review-workspace-20260923]
    paths: [.github/workflows/group-evidence-publication.yml]
permissions:
  contents: write
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cdf1129e5a8cd3a270304f0a11ca0298ce3d0c39
      - name: Verify artifact digests and recompute every retained measurement
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import gzip,hashlib,io,json,os,statistics,sys,urllib.error,urllib.request,zipfile
          from pathlib import Path
          sys.path.insert(0,'tests/performance')
          from group_compare import read_service,summarize
          specs={
            'pre-rollout': (35881057476,'010e5c1e53c89cab629f904ca155ab46212d0761',[
              ('service',10761091624,'046625315b874576266de7ac5350110a38c1e560f507c0f435ea8c6b9d2a002b'),
              ('plain-1',10760802385,'2bd16c4caa04612bc3966e37407d14721b16ab62d03848e66cfe4e18f37fd355'),
              ('plain-16',10760093092,'53711ce9c75b1cf2f61217dd42a631f6237539b3491400c404ec48e1c9e9593f'),
              ('plain-64',10761121545,'55a374d3a2018b26cd4dc563c3182aaaea318b52bb15ca858a7a0ce270613d4f'),
              ('gzip-1',10760847626,'c2e964b5e94440eb00cf75d39219a795f7d3de7499f5e7c15ba30ea2725dbc2b'),
              ('gzip-16',10759829916,'beeed2c2c309c76ded6818c3f7767e08d5e909ae5302934d1db734a45ab53801'),
              ('gzip-64',10760897278,'e8520fbdf1e043eff6e8184813cdf507c1c9899f4e0a82b2d065b50ba999df93')]),
            'opt-in': (35899898869,'cdf1129e5a8cd3a270304f0a11ca0298ce3d0c39',[
              ('service',10767904139,'da52011b295e6a9fe27f0a663801dff61936d9f7a5cbcfec13e3943c3972e0bc'),
              ('plain-1',10769215613,'0e4b7d2d4360fc2f9a9a9808e68ce2119067885eefa19d3d0f0657ec396aa855'),
              ('plain-16',10769165058,'6e936a6404c25fba9b14ee26f130607d0796ce9a6432086ade2f5700af6ab2b0'),
              ('plain-64',10769036129,'47ad0e6cc6d51a3e34170eddb3aff1ba66342486f3e157a8b96149e96d2b20e6'),
              ('gzip-1',10769007050,'a45566249fffa0877da78728410d97b3b042df0cbaadd0d1f1fdcd4f5a20b934'),
              ('gzip-16',10768592564,'f5b8db380fddc26599b3031958e2cc6d173e7b8ef9fdc58efcad0add8424bbe7'),
              ('gzip-64',10769011152,'06dcfd92dcf5076136e84d7200e8931aa303a4a1adb62ac74076ba558ecc5c64')])}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          data={'schema':1,'baseline':'76717b288a170acc0e1e12daf19def9fa7da1bb1','service_baseline':'cf9833b451298c800789f4be06035c44baa7d703','campaigns':{}}
          for phase,(run,head,artifacts) in specs.items():
              campaign={'run_id':run,'head':head,'shards':{}}
              for name,artifact,digest in artifacts:
                  req=urllib.request.Request(f'https://api.github.com/repos/Laisky/go-fluentd/actions/artifacts/{artifact}/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
                  try:
                      response=opener.open(req,timeout=60)
                      raw=response.read()
                  except urllib.error.HTTPError as err:
                      if err.code!=302: raise
                      location=err.headers['Location']
                      assert location.startswith('https://')
                      # Never send repository credentials to the redirected object store.
                      with urllib.request.urlopen(location,timeout=90) as response: raw=response.read()
                  assert hashlib.sha256(raw).hexdigest()==digest,(phase,name,'artifact digest')
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                      get=lambda path: json.loads(archive.read(path))
                      manifest=get('measurements/manifest.json')
                      assert manifest['repeats']==6 and manifest['count']==2048 and manifest['pipeline_count']==8192
                      env=archive.read('environment.txt').decode()
                      assert 'pr-head='+head in env
                      summary=get('measurements/summary.json')
                      assert summary['manifest']==manifest
                      shard={'artifact_id':artifact,'artifact_sha256':digest,'environment':env,'manifest':manifest,'summary':summary}
                      if name=='service':
                          rows=[];raw_runs={}
                          for n in range(6):
                              for variant in ('before','after'):
                                  text=archive.read(f'measurements/service-{n}-{variant}.txt').decode()
                                  raw_runs[f'{n}-{variant}']=text
                                  for profile,metrics in read_service(text,2048).items():rows.append(dict(repeat=n,variant=variant,profile=profile,metrics=metrics))
                          assert summarize(rows,'service',6)==summary['service']
                          assert all(r['metrics']['syncs/msg']==1 for r in rows if r['variant']=='before')
                          shard.update(samples=rows,raw_benchmarks=raw_runs,barrier_controls=get('barrier-controls/summary.json'))
                      else:
                          rows=get('measurements/pipeline-samples.json')
                          assert summarize(rows,'pipeline',6,manifest['profiles'])==summary['pipeline']
                          assert len(rows)==12
                          for row in rows:
                              result=row['details']
                              assert result['accepted']==result['count']==8192 and result['delivered_per_sink']==[8192,8192] and result['durable_ack'] is True
                              if phase=='opt-in':assert result['group_commit_max_messages']==(1 if row['variant']=='before' else 64)
                          shard['samples']=rows
                          if manifest['single_client_controls']:
                              controls=get('measurements/single-client-controls.json');assert len(controls)==12
                              shard['single_client_controls']=controls
                          if phase=='opt-in':
                              audit=get('ledger-audit.json');assert audit['passed'] and audit['samples']==(24 if manifest['single_client_controls'] else 12)
                              assert audit['accepted']==audit['samples']*8192 and audit['sink_deliveries']==2*audit['accepted']
                              shard['ledger_audit']=audit
                      campaign['shards'][name]=shard
                  print('verified',phase,name,digest,flush=True)
              data['campaigns'][phase]=campaign
          root=Path('tests/performance/results/20260923-group');root.mkdir(parents=True,exist_ok=False)
          packed=gzip.compress(json.dumps(data,separators=(',',':'),allow_nan=False).encode(),mtime=0)
          (root/'paired-evidence.json.gz').write_bytes(packed)
          assert json.loads(gzip.decompress(packed))==data
          final=data['campaigns']['opt-in']['shards'];old=data['campaigns']['pre-rollout']['shards']
          rows=[]
          add=rows.append
          add('# Durable group commit: measured result and conservative rollout\n')
          add('Measured source/harness head: `cdf1129e5a8cd3a270304f0a11ca0298ce3d0c39`; tested merge: `3f1091a64192d0ec751fa0b8f4da326d1b5dd7d3`. This report and its dataset are documentation-only additions. Baseline executable: merged #11, `76717b288a170acc0e1e12daf19def9fa7da1bb1`; the current master tree at `28f221d` is identical. Journal service baseline `cf9833b` extracts the same original per-record writer. No dependency version or on-disk format changes are needed.\n')
          add('## Result\n')
          add('Ready-only grouping materially reduces amortized journal service cost under concurrent requests. The full-process concurrent medians also improve, but tail latency and low-load observations are not uniformly better. **Grouping is opt-in, not a new default.** `group_commit_max_messages: 0` or `1` preserves per-record Sync; `64` enables grouping, with a configurable upper bound of 1024. There is no timer waiting for a second message.\n')
          add('Every reliable receipt still follows all writes and a successful shared Sync. A failed write or barrier fails the affected owned group; a failure/timeout is an unknown outcome, not proof that no bytes were written. Cancellation cannot abort a kernel Sync already in progress and cannot replace its actual completed result. Size bounds do not impose a wall-clock bound on storage I/O.\n')
          add('## Measurement discipline\n')
          add('Six counterbalanced before/after pairs per profile, Go 1.27.1, Linux amd64 and GOMAXPROCS=2. Each pair uses the same runner and identical current harness. Profiles run on separate hosted VMs: do not interpret cross-profile values as a scaling curve. Exact CPU, filesystem, revisions and binary hashes are in the dataset. The service benchmark uses 2048 two-KiB records per sample; the full executable uses 8192 timed records plus an excluded warmup, durable HTTP acceptance and two independently fsynced Elasticsearch-protocol peers. The benchmark configures before=1 and after=64 explicitly.\n')
          add('Timing binaries are uninstrumented; race runs and evidence auditing are separate. All values below are medians; raw samples, min/max and paired ratios are retained, with no statistical-significance claim. P99 is HTTP durable-acceptance latency, **not end-to-end delivery latency**. The closed-loop client, protocol peers, disk writes and finite-batch completion contribute to pipeline timings. Highly compressible payloads and ext4 CI volumes with `nobarrier`, `data=writeback`, and `journal_async_commit` are not production-device capacity or physical-power-loss qualification.\n')
          add('## Journal service\n')
          add('| Profile | Before microseconds/message | Grouped | Time change | Grouped Sync calls/message |')
          add('|---|---:|---:|---:|---:|')
          for profile,item in final['service']['summary']['service'].items():
              ns=item['ns/op'];sync=item['syncs/msg']['after']['median']
              add(f"| {profile} | {ns['before']['median']/1000:.3f} | {ns['after']['median']/1000:.3f} | {ns['median_change_percent']:+.2f}% | {sync:.5f} |")
          add('\nService time is amortized completed-record cost, not one request\'s latency. The baseline uses exactly one Sync call per record. Fewer calls cover multiple records behind the same success-after-Sync barrier; this is not a comparison with buffered-only acknowledgement. Single-client plain/gzip service cost is slightly worse and is retained.\n')
          add('## Full executable and two sinks\n')
          add('| Profile | Before delivered events/s | Grouped | Change | Before acceptance P99 ms | Grouped P99 ms |')
          add('|---|---:|---:|---:|---:|---:|')
          for name in ['plain-1','plain-16','plain-64','gzip-1','gzip-16','gzip-64']:
              profile,item=next(iter(final[name]['summary']['pipeline'].items()));v=item['delivered_per_second'];lat=item['p99_ms']
              add(f"| {profile} | {v['before']['median']:.2f} | {v['after']['median']:.2f} | {v['median_change_percent']:+.2f}% | {lat['before']['median']:.3f} | {lat['after']['median']:.3f} |")
          add('\nThe four concurrent profiles improve their delivered-rate medians, but plain/64-client acceptance P99 worsens by about 16%. These are observed workload-specific gains, not guaranteed production percentages. No low-load speedup is established by the inconsistent campaigns and controls.\n')
          add('## Why the default remains per-record\n')
          add('The earlier six-pair 8192-event campaign on `010e5c1` had an 11.6% lower plain/single-client delivered median. The new run has a higher baseline-to-candidate median for that profile, but its same-candidate-binary 1-versus-64 control goes the other direction. No code change was made to hide the unfavorable measurements or add artificial delay to the baseline. The rollout decision is conservative; it does not claim that changing the default repairs a proven timing defect.\n')
          add('| Same candidate binary, one client | Group=1 delivered/s | Group=64 delivered/s | Change |')
          add('|---|---:|---:|---:|')
          for name in ['plain-1','gzip-1']:
              controls=final[name]['single_client_controls'];med={m:statistics.median(c['result']['delivered_per_second'] for c in controls if c['maximum']==m) for m in [1,64]}
              add(f"| {name} | {med[1]:.2f} | {med[64]:.2f} | {(med[64]/med[1]-1)*100:+.2f}% |")
          add('\n### Previous campaign is retained, not replaced\n')
          add('| Profile | Previous before delivered/s | Previous grouped | Change |')
          add('|---|---:|---:|---:|')
          for name in ['plain-1','plain-16','plain-64','gzip-1','gzip-16','gzip-64']:
              profile,item=next(iter(old[name]['summary']['pipeline'].items()));v=item['delivered_per_second']
              add(f"| {profile} | {v['before']['median']:.2f} | {v['after']['median']:.2f} | {v['median_change_percent']:+.2f}% |")
          add('\nThe previous single-client gzip service median was also 84.6% slower. All corresponding service samples and same-binary controls remain in the archive. Compare each campaign only with its own paired baseline.\n')
          add('## Reliability and test quality\n')
          audits=[v['ledger_audit'] for k,v in final.items() if k!='service']
          assert sum(a['samples'] for a in audits)==96
          assert sum(a['accepted'] for a in audits)==786432 and sum(a['sink_deliveries'] for a in audits)==1572864
          add('The final campaign independently audited **96 pipeline/control samples, 786432 timed accepted events and 1572864 sink deliveries**, excluding warmups. Every persisted producer/sink event, JSON field and type, unique delivery identity, HTTP outcome, latency quantile, policy and reported rate passed reconciliation. No missing/extra/duplicate or corrupted event was accepted. Per-file evidence hashes are retained. The auditor is separate from the benchmark runner and has negative controls for corruption, missing events, weaker policies and false performance claims. The earlier campaign was separately audited in the working environment with the same 96-sample totals.\n')
          add('Permanent delivery CI runs 27 executable cases for group=1/64 and seeds=127/991, for **108 case executions**. These include SIGKILL after acceptance, partially answered concurrent cohorts, retries, failed sinks, interrupted appends and kernel-enforced write refusal. Writer tests cover late arrivals, rotated files, shared errors, previous-success isolation, tag separation, mixed reliability, bounds, closure and cancellation during Sync. Twenty shuffled Journal race runs pass. Mutation controls reject omitted Sync, early success and ignored Sync errors, with an independent best-effort control still passing.\n')
          add('The new default-policy test intentionally failed the old automatic-grouping policy before the opt-in correction. That is a rollout-requirement change, not a claim that the old default was a newly discovered data-loss bug. Cancellation-during-Sync controls already passed before the correction.\n')
          add('## Incremental commits and verification\n')
          add('- `5350923`: default-policy and cancellation-during-Sync tests.\n- `9b55321`: opt-in rollout correction; explicit policy configuration outside benchmark timing.\n- `cdf1129`: independent persisted-evidence auditing and both-policy permanent delivery coverage.\n')
          add('Source validation: [build/vet/race/Docker](https://github.com/Laisky/go-fluentd/actions/runs/35899898806), [108 delivery cases and original negative controls](https://github.com/Laisky/go-fluentd/actions/runs/35899899365), [group measurements, audits and unsafe-mutation controls](https://github.com/Laisky/go-fluentd/actions/runs/35899898869), [35 component workloads](https://github.com/Laisky/go-fluentd/actions/runs/35899898842), [CodeQL](https://github.com/Laisky/go-fluentd/actions/runs/35899898738). All passed for the recorded measured source. Earlier campaign: [35881057476](https://github.com/Laisky/go-fluentd/actions/runs/35881057476). No merge or deployment.\n')
          add('## Reproduction and retained evidence\n')
          add('Keep the existing configuration and set `settings.journal.group_commit_max_messages: 64` only to opt in. Reliable HTTP requires the existing receiver\'s `require_durable_ack: true`. Omitted/zero/one grouping retains per-record Sync; explicit lossy/dry configurations are not covered by this reliable profile.\n')
          add('```sh\ngo build -mod=readonly -race -o /tmp/go-fluentd-delivery .\npython3 tests/delivery/run.py --binary /tmp/go-fluentd-delivery --artifacts /tmp/delivery-per-record --seed 127 --group-max-messages 1\npython3 tests/delivery/run.py --binary /tmp/go-fluentd-delivery --artifacts /tmp/delivery-grouped --seed 991 --group-max-messages 64\ngo test -mod=readonly -race -count=20 -shuffle=on -run \'^TestJournal\' ./internal/controller\npython3 .scripts/verify_group_commit_contracts.py --evidence /tmp/group-barrier-controls\npython3 -m unittest discover -s tests/performance -p \'test_*.py\'\n```\n')
          add('The read-only `.github/workflows/group-commit.yml` contains exact baseline builds, identical benchmark copying, all repetitions and the auditor command. [Compressed retained evidence](../tests/performance/results/20260923-group/paired-evidence.json.gz) contains both campaigns\' raw journal output, individual numeric samples, full summaries/ranges, controls, manifests, binary hashes, environments, artifact digests and final ledger audits. Full per-request files and sink ledgers remain in the linked CI artifacts (14-day retention); rerunning the workflow regenerates them.\n')
          add('```python\nimport gzip, json\nwith gzip.open("tests/performance/results/20260923-group/paired-evidence.json.gz", "rt") as source:\n    evidence = json.load(source)\nassert set(evidence["campaigns"]) == {"pre-rollout", "opt-in"}\n```\n')
          add('This validates the stated real-process/workload contracts, not all possible interleavings, unlimited backlog, arbitrary corruption, physical power loss or a real Kafka/Elasticsearch cluster. TCP ingress still lacks a durable ingress acknowledgement. No exactly-once guarantee is introduced.\n')
          Path('docs/group-commit-performance.md').write_text('\n'.join(rows))
          print('retained archive bytes',len(packed),'sha256',hashlib.sha256(packed).hexdigest())
          PY
      - name: Publish only immutable measurements and their report
        run: |
          git diff --exit-code
          git config user.name Laisky
          git config user.email public@laisky.com
          git add docs/group-commit-performance.md tests/performance/results/20260923-group/paired-evidence.json.gz
          git commit -m 'docs(perf): retain both measured group-commit campaigns and rollout tradeoffs'
          git push origin HEAD:refs/heads/perf/durable-group-commit-20260923
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: group-commit-retained-report
          path: |
            docs/group-commit-performance.md
            tests/performance/results/20260923-group/paired-evidence.json.gz
          retention-days: 14
