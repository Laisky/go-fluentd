name: Verify and publish issue 24
on:
  push:
    branches: [codex/security-resume-20261006-2149]
    paths: [.github/workflows/security-publish-24.yml, .scripts/security-24-repair.py]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Verify complete source transport and tree
        run: |
          set -euo pipefail
          mkdir /tmp/evidence24
          cp .scripts/security-24-part-*.b64 /tmp/evidence24/
          if test -f .scripts/security-24-repair.py; then python .scripts/security-24-repair.py; fi
          python - <<'PY'
          import base64,zlib,hashlib,pathlib
          p=pathlib.Path('/tmp/evidence24')
          hashes=['902205dd3d9f71bbb458c192c28e3a84ac3a500ff474168f2cb234e9589fda11','80bda06bd618cb4ab6861ade97232f7df96219c0ac3d00a4f670f574fbea6097','98c1638bd2beca4af4362db0bae97eaef316ec7ca0ccf72005f90b882c4db376','7b04c8aa2de664ece8bb6221677151cc35da803c733789ff777a2612aa3cb67a']
          parts=[''.join((p/f'security-24-part-{i}.b64').read_text().split()) for i in range(4)]
          for i,(part,want) in enumerate(zip(parts,hashes)):
              assert hashlib.sha256(part.encode()).hexdigest()==want, ('damaged part',i)
          patch=zlib.decompress(base64.b64decode(''.join(parts),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='52d033c8d7551d97800f30bb65db5c17481624c96462960354328e75c6ee6c2d'
          (p/'fix.patch').write_bytes(patch)
          PY
          git checkout --detach a61f532bf36a4503aba5fe8548c814745550b7c6
          test "$(git rev-parse HEAD^{tree})" = 1b8b2250b59d0f450802364239a6c5475df21ea8
          git apply --index /tmp/evidence24/fix.patch
          git diff --cached --check
          test "$(git write-tree)" = b0407f7dc262f27142cb5eef36b9c10075da7ec6
      - name: Require both original concatenators to fail behavioral assertions
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/red24 a61f532bf36a4503aba5fe8548c814745550b7c6
          cp internal/recvs/concat_budget_regression_test.go /tmp/red24/internal/recvs/
          cp internal/tagfilters/concat_budget_regression_test.go /tmp/red24/internal/tagfilters/
          cd /tmp/red24
          set +e
          go test -mod=readonly -count=1 -timeout=180s -run '^TestRegression.*ConcatPendingBound$' -json ./internal/recvs ./internal/tagfilters > /tmp/evidence24/red.json 2>&1
          code=$?
          set -e
          test "$code" = 1
          python - <<'PY'
          import json,pathlib
          events=[json.loads(l) for l in pathlib.Path('/tmp/evidence24/red.json').read_text().splitlines() if l.startswith('{')]
          wanted={'TestRegressionReceiverConcatPendingBound','TestRegressionTagFilterConcatPendingBound'}
          failed={e.get('Test') for e in events if e.get('Action')=='fail' and e.get('Test')}
          assert failed==wanted,failed
          for name in wanted:
              assert any(e.get('Test')==name and 'CONCAT_BUDGET_REGRESSION:' in e.get('Output','') for e in events),name
          PY
      - name: Full acceptance and unchanged dependency manifests
        run: |
          set -euo pipefail
          go mod verify
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 -timeout=180s -coverprofile=/tmp/evidence24/coverage.out ./... | tee /tmp/evidence24/full.log
          python .scripts/check_component_coverage.py /tmp/evidence24/coverage.out | tee /tmp/evidence24/coverage.log
          go test -mod=readonly -race -count=3 -shuffle=on -timeout=180s ./internal/concatstate ./internal/recvs ./internal/tagfilters | tee /tmp/evidence24/race.log
          GOMAXPROCS=2 go test -mod=readonly ./internal/concatstate -run '^$' -fuzz '^FuzzPendingStateOwnership$' -fuzztime=20s | tee /tmp/evidence24/fuzz.log
          go test -mod=readonly ./internal/concatstate -run '^$' -bench BenchmarkPendingBudget -benchmem | tee /tmp/evidence24/bench.log
          git diff --exit-code
          test "$(git write-tree)" = b0407f7dc262f27142cb5eef36b9c10075da7ec6
      - name: Publish only accepted source
        run: |
          set -euo pipefail
          git config user.name 'Laisky.Cai'
          git config user.email 'github@laisky.com'
          git commit -m 'fix: share bounded multiline pending state without false acknowledgements'
          git rev-parse HEAD HEAD^{tree} | tee /tmp/evidence24/source.txt
          git push origin HEAD:refs/heads/codex/security-24-concat-budget-20261006
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue24-red-green-evidence
          path: /tmp/evidence24
          retention-days: 14
          if-no-files-found: error
