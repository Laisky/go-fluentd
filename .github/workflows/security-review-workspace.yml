name: Security Review Workspace

on:
  push:
    branches: [codex/security-review-workspace-20261006]
    paths: [.github/workflows/security-review-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 531bda03f839d09acf5208394b9b364e29045484
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - name: Prepare public source and offline test dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/review
          git archive HEAD | tar -x -C /tmp/review
          cd /tmp/review
          go mod vendor
          printf 'source=%s\n' 531bda03f839d09acf5208394b9b364e29045484 > REVIEW_SOURCE.txt
          go version >> REVIEW_SOURCE.txt
          tar -czf /tmp/review-source.tar.gz .
          cd "$GITHUB_WORKSPACE"
          git fetch origin e174aa4741826290c600a415c931fb7130b46d32 --depth=1
          git archive e174aa4741826290c600a415c931fb7130b46d32 > /tmp/review-baseline.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-security-review-recovered
          path: |
            /tmp/review-source.tar.gz
            /tmp/review-baseline.tar
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
