name: Legacy journal private storage
on:
  push:
    branches: [master, develop]
    paths: ['go.mod', 'go.sum', '**/*.go', '.github/workflows/legacy-journal-permissions.yml']
  pull_request:
    branches: [master, develop]
    paths: ['go.mod', 'go.sum', '**/*.go', '.github/workflows/legacy-journal-permissions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - name: Reproduce all three assertions on the frozen pre-fix baseline
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/private-journal-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source.txt"
          go version >> "$evidence/source.txt"
          baseline="$RUNNER_TEMP/private-journal-baseline"
          git worktree add --detach "$baseline" 7f06b5bb68f373995b712db4f7882f9bb2d72867
          cp internal/controller/journal_permissions_regression_test.go "$baseline/internal/controller/"
          (cd "$baseline" && go mod download)
          set +e
          (cd "$baseline" && go test -mod=readonly -count=1 -timeout=180s -json -run '^TestRegressionLegacyPrivate(Root|ChildAndFiles|Creation)$' ./internal/controller) > "$evidence/red.jsonl" 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          python3 - "$evidence/red.jsonl" <<'PY'
          import json, sys
          expected = {'TestRegressionLegacyPrivateRoot', 'TestRegressionLegacyPrivateChildAndFiles', 'TestRegressionLegacyPrivateCreation'}
          failed, started = set(), set()
          with open(sys.argv[1]) as stream:
              for line in stream:
                  row = json.loads(line)
                  if row.get('Action') == 'build-fail':
                      raise SystemExit('a build error is not behavioral reproduction')
                  if row.get('Action') == 'run': started.add(row.get('Test'))
                  if row.get('Action') == 'fail': failed.add(row.get('Test'))
          if not expected <= failed or not expected <= started:
              raise SystemExit(f'missing expected assertion failures: started={started} failed={failed}')
          print('All three baseline-compatible regressions failed on assertions as required')
          PY
      - name: Fixed behavior, rotation, replay, and race regressions
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          PYTHONPATH=tests/delivery python3 -m unittest test_delivery.AppFixtureTests -v
          go test -mod=readonly -race -count=3 -shuffle=on -timeout=180s -v -run 'Test(RegressionLegacyPrivate|LegacyPrivate|LegacyJournalSecurity)' ./internal/controller 2>&1 | tee "$RUNNER_TEMP/private-journal-evidence/green.log"
      - name: Execute actual UID and ownership isolation without skipped tests
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/private-journal-evidence/controller.test"
          go test -mod=readonly -race -c -o "$binary" ./internal/controller
          sudo -- "$binary" '-test.run=^TestLegacyPrivate(OtherUID|ForeignOwner)$' -test.v -test.timeout=60s 2>&1 | tee "$RUNNER_TEMP/private-journal-evidence/uid.log"
          python3 - "$RUNNER_TEMP/private-journal-evidence/uid.log" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          expected = {'TestLegacyPrivateOtherUID', 'TestLegacyPrivateForeignOwner'}
          passed = set(re.findall(r'^--- PASS: (\w+) ', text, re.M))
          if passed != expected or '--- SKIP:' in text or '--- FAIL:' in text or not re.search(r'^PASS$', text, re.M):
              raise SystemExit('privileged permission qualification did not fully execute and pass')
          print('Actual other-UID and foreign-owner tests passed without skips')
          PY
          rm "$binary"
          git diff --exit-code -- go.mod go.sum
      - name: Preserve reproduction and acceptance logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-journal-private-storage
          path: ${{ runner.temp }}/private-journal-evidence/
          retention-days: 14
          if-no-files-found: error
