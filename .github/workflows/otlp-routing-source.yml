name: OTLP routing diagnostic source
on:
  push:
    branches: [ci/otlp-routing-source-20260924]
    paths: [.github/workflows/otlp-routing-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 13b0bb767e72b8691ae5761e1399ad39975a0610
          fetch-depth: 0
          persist-credentials: false
      - name: Export verified source
        run: |
          set -eu
          mkdir -p /tmp/routing-source
          git bundle create /tmp/routing-source/source.bundle HEAD
          git rev-parse HEAD > /tmp/routing-source/head.txt
          git rev-parse HEAD^{tree} > /tmp/routing-source/tree.txt
          sha256sum /tmp/routing-source/source.bundle > /tmp/routing-source/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: otlp-routing-source
          path: /tmp/routing-source
          retention-days: 7
