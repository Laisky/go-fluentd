name: Migration bootstrap

on:
  push:
    branches: [fix/go127-reliability]
    paths: [.github/workflows/migration-bootstrap.yml]

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'Laisky/go-fluentd' && github.ref == 'refs/heads/fix/go127-reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: Update JSON runtime compatibility and fix vet baseline
        run: |
          go get github.com/json-iterator/go@v1.1.12 github.com/modern-go/reflect2@v1.0.2
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/recvs/http.go')
          s = p.read_text()
          assert s.count('fmt.Errorf(msg)') == 1
          p.write_text(s.replace('fmt.Errorf(msg)', 'fmt.Errorf("%s", msg)'))
          PY
          gofmt -w internal/recvs/http.go internal/senders/reliability_test.go library/fluentd_reliability_test.go library/timer_test.go
          go test -mod=mod -run '^$' ./...
      - name: Commit generated module graph and checksums to the PR branch
        run: |
          git config user.name 'Laisky'
          git config user.email 'public@laisky.com'
          git add go.mod go.sum internal/recvs/http.go internal/senders/reliability_test.go library/fluentd_reliability_test.go library/timer_test.go
          git diff --cached --stat
          git commit -m 'build: fix JSON runtime compatibility and Go 1.27 vet baseline'
          git push origin HEAD:refs/heads/fix/go127-reliability
          git rev-parse HEAD
      - name: Reproduce sender failures after isolating runtime compatibility
        run: go test -mod=readonly -count=1 -v -run TestRegression ./internal/senders ./library
