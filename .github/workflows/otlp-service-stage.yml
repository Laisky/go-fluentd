name: Stage verified OTLP configured service
on:
  push:
    branches: [ci/otlp-service-publish-20260925]
    paths: [.github/workflows/otlp-service-stage.yml, .audit/otlp-service-corrections.json]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GOMAXPROCS: '4'
      GORACE: 'halt_on_error=1 exitcode=66'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Verify source transfer and exact first tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/otlp-service-stage/transfer
          cp .audit/otlp-service-*.txt /tmp/otlp-service-stage/transfer/
          if test -f .audit/otlp-service-corrections.json; then cp .audit/otlp-service-corrections.json /tmp/otlp-service-stage/transfer/; fi
          python3 - <<'PY'
          import pathlib,json,base64,zlib,hashlib,subprocess
          root=pathlib.Path('/tmp/otlp-service-stage')
          parts={str(i):(root/'transfer'/f'otlp-service-{i}.txt').read_text().strip() for i in range(3)}
          fixes=root/'transfer'/'otlp-service-corrections.json'
          if fixes.exists():
              for key, edits in json.loads(fixes.read_text()).items():
                  for edit in sorted(edits,key=lambda x:x['offset'],reverse=True):
                      n=edit['offset']; old=edit['old']; new=edit['new']
                      assert parts[key][n:n+len(old)]==old
                      parts[key]=parts[key][:n]+new+parts[key][n+len(old):]
          raw=zlib.decompress(base64.b64decode(''.join(parts[str(i)] for i in range(3)),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='af1819faef58ab1e6ba72c1f5e17d93b9b8d2f00f121d47e903c0aa08886ae10'
          m=json.loads(raw); assert m['base']=='bee0dfc39b68a2dd72679ab8b1081f3f43f74414' and len(m['commits'])==2
          for i,c in enumerate(m['commits']):
              b=c['patch'].encode(); assert hashlib.sha256(b).hexdigest()==c['sha256']
              (root/f'{i}.patch').write_bytes(b)
          (root/'manifest.json').write_bytes(raw)
          subprocess.run(['git','checkout','--detach',m['base']],check=True)
          subprocess.run(['git','apply','--index',str(root/'0.patch')],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==m['commits'][0]['tree']
          PY
      - name: Validate and commit listener increment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Laisky.Cai'
          git config user.email 'github@laisky.com'
          go version > /tmp/otlp-service-stage/toolchain.txt
          go mod verify > /tmp/otlp-service-stage/modules.txt
          go test -mod=readonly -count=1 -timeout=180s -json -run '^TestOTLPService' ./internal/controller > /tmp/otlp-service-stage/listener.jsonl
          git diff --cached --check
          git commit -m "$(python3 -c "import json;print(json.load(open('/tmp/otlp-service-stage/manifest.json'))['commits'][0]['message'])")"
          git rev-parse HEAD > /tmp/otlp-service-stage/first-head.txt
          git apply --index /tmp/otlp-service-stage/1.patch
          test "$(git write-tree)" = f25b81750be7728e1fce0c1c2997d48035b9672d
      - name: Native full application and configured executable acceptance
        shell: bash
        run: |
          set -euo pipefail
          cp go.mod go.sum /tmp/otlp-service-stage/
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 -timeout=180s -json ./... > /tmp/otlp-service-stage/full.jsonl
          go test -mod=readonly -race -count=3 -shuffle=on -timeout=180s -json -run '^TestOTLPService' ./internal/controller > /tmp/otlp-service-stage/race.jsonl
          go build -mod=readonly -race -o /tmp/go-fluentd-otlp .
          python3 tests/otlp_service/run.py --binary /tmp/go-fluentd-otlp --artifacts /tmp/otlp-service-stage/cli
          python3 .scripts/verify_otlp_service_contracts.py --artifacts /tmp/otlp-service-stage/negative
          git diff --exit-code -- go.mod go.sum
          git diff --cached --check
      - name: Publish validated commits to separate staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "$(python3 -c "import json;print(json.load(open('/tmp/otlp-service-stage/manifest.json'))['commits'][1]['message'])")"
          git rev-parse HEAD > /tmp/otlp-service-stage/head.txt
          git rev-parse HEAD^{tree} > /tmp/otlp-service-stage/tree.txt
          sha256sum internal/controller/otlp_service*.go internal/controller/controllor.go cmd/root.go main.go tests/otlp_service/run.py docs/settings/otlp.yml > /tmp/otlp-service-stage/source-hashes.txt
          git bundle create /tmp/otlp-service-stage/source.bundle HEAD ^bee0dfc39b68a2dd72679ab8b1081f3f43f74414
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push "https://github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/ci/otlp-service-validated-20260925
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: otlp-service-source-stage
          path: /tmp/otlp-service-stage
          retention-days: 7
