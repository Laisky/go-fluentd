name: OTLP terminal disposition contracts
on:
  pull_request:
    paths:
      - 'internal/otlpstate/**'
      - '.scripts/verify_otlp_state_contracts.py'
      - '.github/workflows/otlp-state.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [master]
    paths:
      - 'internal/otlpstate/**'
      - '.scripts/verify_otlp_state_contracts.py'
      - '.github/workflows/otlp-state.yml'
      - 'go.mod'
      - 'go.sum'
permissions:
  contents: read
jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - name: Source and native dependency integrity
        run: |
          set -euo pipefail
          mkdir -p /tmp/otlp-state-evidence
          go version | tee /tmp/otlp-state-evidence/toolchain.txt
          git rev-parse HEAD > /tmp/otlp-state-evidence/head.txt
          git rev-parse HEAD^{tree} > /tmp/otlp-state-evidence/tree.txt
          cp go.mod go.sum /tmp/otlp-state-evidence/
          go mod verify | tee /tmp/otlp-state-evidence/module-verify.txt
          test -z "$(gofmt -l internal/otlpstate)"
          sha256sum internal/otlpstate/*.go > /tmp/otlp-state-evidence/source-hashes.txt
      - name: Public outcomes, real process crashes and storage refusal
        run: |
          set -euo pipefail
          go vet -mod=readonly ./internal/otlpstate
          go test -mod=readonly -count=1 -timeout=90s -coverprofile=/tmp/otlp-state-evidence/coverage.out -json ./internal/otlpstate > /tmp/otlp-state-evidence/tests.jsonl
          go test -mod=readonly -race -count=3 -shuffle=on -timeout=180s -json ./internal/otlpstate > /tmp/otlp-state-evidence/race.jsonl
      - name: Reject weakened barriers and unsafe terminal replay
        run: |
          set -euo pipefail
          python3 .scripts/verify_otlp_state_contracts.py --artifacts /tmp/otlp-state-evidence/negative
          git diff --exit-code -- go.mod go.sum internal/otlpstate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: otlp-terminal-state-${{ github.sha }}
          path: /tmp/otlp-state-evidence
          retention-days: 14
