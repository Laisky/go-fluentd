name: Coverage baseline
on:
  push:
    branches: [test/component-behavior-coverage]
    paths: [.github/workflows/coverage-baseline.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.1
      - name: Baseline coverage and offline verification inputs
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          go test -mod=readonly -coverprofile=/tmp/baseline.cover -covermode=atomic -count=1 -timeout=180s ./...
          go tool cover -func=/tmp/baseline.cover
          mkdir -p /tmp/verification
          cp /tmp/baseline.cover /tmp/verification/
          git archive --format=tar HEAD | gzip -1 > /tmp/verification/source.tar.gz
          tar -C "$(dirname "$(go env GOROOT)")" -czf /tmp/verification/toolchain.tar.gz "$(basename "$(go env GOROOT)")"
          tar -C "$(go env GOPATH)/pkg" -czf /tmp/verification/modules.tar.gz mod
      - uses: actions/upload-artifact@v4
        with:
          name: component-coverage-baseline
          path: /tmp/verification/
          retention-days: 7
          compression-level: 0
