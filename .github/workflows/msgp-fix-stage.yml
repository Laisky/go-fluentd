name: Stage verified MessagePack fix
on:
  push:
    branches: [ci/otlp-routing-source-20260924]
    paths: [.github/workflows/msgp-fix-stage.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d649871e4cbefe02ad7512d349d63147ba139541
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Generate and validate the dependency-only correction
        run: |
          set -eu
          mkdir -p /tmp/msgp-fix
          test "$(git rev-parse HEAD)" = d649871e4cbefe02ad7512d349d63147ba139541
          go list -m all > /tmp/msgp-fix/before.txt
          go get github.com/tinylib/msgp@v1.1.9
          go mod tidy
          go list -m all > /tmp/msgp-fix/after.txt
          go mod verify > /tmp/msgp-fix/verify.txt
          go version > /tmp/msgp-fix/go.txt
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 -timeout=180s -json ./... > /tmp/msgp-fix/full.jsonl
          go test -mod=readonly -race -count=3 -shuffle=on -timeout=180s -json ./... > /tmp/msgp-fix/race.jsonl
          GOGC=10 go test -mod=readonly -race -count=1000 -timeout=120s -run '^TestRegressionFluent(ConcurrentTagRouting|WireOracleRejectsWrongRoute)$' -json ./internal/senders > /tmp/msgp-fix/stress.jsonl
          git diff --check
          test "$(git diff --name-only)" = "$(printf 'go.mod\ngo.sum')"
          cp go.mod go.sum /tmp/msgp-fix/
      - name: Stage verified source on a new branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name 'Laisky.Cai'
          git config user.email 'github@laisky.com'
          git add go.mod go.sum
          git commit -m 'fix(deps): update MessagePack to retain decoded strings safely across GC'
          git rev-parse HEAD > /tmp/msgp-fix/head.txt
          git rev-parse HEAD^{tree} > /tmp/msgp-fix/tree.txt
          git bundle create /tmp/msgp-fix/source.bundle HEAD
          gh auth setup-git
          git push origin HEAD:refs/heads/ci/msgp-fix-validated-20260924
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: msgp-fix-validated
          path: /tmp/msgp-fix
          retention-days: 7
