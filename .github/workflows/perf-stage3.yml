name: Encoder performance iteration
on:
  push:
    branches: [perf/measured-pipeline-20260923]
    paths: [.github/workflows/perf-stage3.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - name: Decode hash-checked source inputs
        env:
          PAYLOAD: 
        run: |
          python3 - <<'PY'
          import os,base64,gzip,json,hashlib
          from pathlib import Path
          data=os.environ['PAYLOAD'].replace('ZXMuEbEb2','ZXMuEb2')
          files=json.loads(gzip.decompress(base64.b64decode(data)))
          assert set(files)=={'library/encoder_performance_test.go','library/fluentd.go','library/fluentd_reliability_test.go'}
          for name,item in files.items():
              p=Path(name)
              assert (hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None)==item['before'],name
          Path('/tmp/encoder-sources.json').write_text(json.dumps(files))
          Path('library/encoder_performance_test.go').write_text(files['library/encoder_performance_test.go']['after'])
          PY
      - name: Run independent wire and failure contracts on unchanged encoder
        run: go test -mod=readonly -count=1 -run TestPerformanceContract ./library
      - name: Apply the locally measured direct-framing implementation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name,item in json.loads(Path('/tmp/encoder-sources.json').read_text()).items():
              Path(name).write_text(item['after'])
          PY
          test -z "$(gofmt -l library/encoder_performance_test.go library/fluentd.go library/fluentd_reliability_test.go)"
      - name: Full build and repeated correctness validation
        run: |
          go mod verify
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 -timeout=180s ./...
          go test -mod=readonly -race -count=5 -shuffle=on -timeout=180s ./...
      - name: Publish validated implementation and behavior tests
        run: |
          git config user.name Laisky
          git config user.email public@laisky.com
          git add library/encoder_performance_test.go library/fluentd.go library/fluentd_reliability_test.go
          git commit -m 'perf(encoder): write Forward frames directly without per-message wrappers'
          git push origin HEAD:refs/heads/perf/measured-pipeline-20260923
