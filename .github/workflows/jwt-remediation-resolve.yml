name: JWT dependency remediation resolution

on:
  push:
    branches: [chore/dependencies-20260928]
    paths: ['.github/workflows/jwt-remediation-resolve.yml']

permissions:
  contents: read

jobs:
  resolve:
    if: github.repository == 'Laisky/go-fluentd' && github.ref == 'refs/heads/chore/dependencies-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - name: Resolve metrics-only dependency graph
        run: |
          set -euo pipefail
          mkdir -p /tmp/jwt-remediation
          git rev-parse HEAD > /tmp/jwt-remediation/source.txt
          go version > /tmp/jwt-remediation/go-version.txt
          cp go.mod /tmp/jwt-remediation/before.mod
          gofmt -w internal/controller/metrics_dependency_test.go
          go mod tidy
          go mod verify
          go mod graph > /tmp/jwt-remediation/module-graph.txt
          python3 .scripts/test_metrics_dependencies.py
          python3 .scripts/check_metrics_dependencies.py /tmp/jwt-remediation/candidate
      - name: Verify build and metrics behavior
        run: |
          set -euo pipefail
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -race -count=3 -timeout=180s -json -run '^TestRegressionMetricsDependencyCompatibility$' ./internal/controller > /tmp/jwt-remediation/candidate-metrics.jsonl
      - name: Same metrics contract against pre-remediation application
        run: |
          set -euo pipefail
          control=$(mktemp -d)
          git worktree add --detach "$control" a1165c8e15af9bc96555807f24271453e316e7c4
          cp internal/controller/metrics_dependency_test.go "$control/internal/controller/"
          cp .scripts/check_metrics_dependencies.py "$control/.scripts/"
          (cd "$control" && go test -mod=readonly -race -count=3 -timeout=180s -json -run '^TestRegressionMetricsDependencyCompatibility$' ./internal/controller) > /tmp/jwt-remediation/previous-metrics.jsonl
          set +e
          python3 "$control/.scripts/check_metrics_dependencies.py" /tmp/jwt-remediation/previous > /tmp/jwt-remediation/previous-policy.log 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          grep -F 'ValueError: removed metrics/JWT modules reintroduced:' /tmp/jwt-remediation/previous-policy.log
          git worktree remove --force "$control"
          python3 - <<'PY'
          import json
          from pathlib import Path
          name = 'TestRegressionMetricsDependencyCompatibility'
          for label in ('candidate', 'previous'):
              rows = [json.loads(line) for line in Path('/tmp/jwt-remediation', label+'-metrics.jsonl').read_text().splitlines()]
              if any(row['Action'] in ('fail', 'skip', 'build-fail') for row in rows):
                  raise SystemExit(label+' did not pass')
              if sum(row['Action'] == 'pass' and row.get('Test') == name for row in rows) != 3:
                  raise SystemExit(label+' did not execute exactly three metrics contracts')
          print('Both implementations passed the same three race-enabled metrics contracts; the dependency policy rejects the previous graph.')
          PY
      - name: Full behavior suite
        run: |
          set -euo pipefail
          go test -mod=readonly -count=1 -timeout=180s ./... 2>&1 | tee /tmp/jwt-remediation/tests.log
          go mod tidy -diff
      - name: Commit only resolved manifests and test formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git diff --quiet -- go.mod go.sum internal/controller/metrics_dependency_test.go; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add go.mod go.sum internal/controller/metrics_dependency_test.go
            git commit -m 'fix(deps): prune unused gin JWT dependency and verified module checksums'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/chore/dependencies-20260928
          fi
          git rev-parse HEAD > /tmp/jwt-remediation/committed-head.txt
      - name: Retain exact evidence
        if: always()
        run: |
          mkdir -p /tmp/jwt-remediation
          cp go.mod go.sum /tmp/jwt-remediation/
          git diff -- go.mod go.sum > /tmp/jwt-remediation/module.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jwt-remediation
          path: /tmp/jwt-remediation
          retention-days: 14
          if-no-files-found: error
