name: Replay repair
on:
  push:
    branches: [fix/go127-reliability]
    paths: [.github/workflows/replay-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'Laisky/go-fluentd' && github.ref == 'refs/heads/fix/go127-reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: Extract existing retry behavior and add replay regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/controller/journal.go');s=p.read_text()
          old='func (j *Journal) ProcessLegacyMsg(dumpChan chan *library.FluentMsg) (maxID int64, err2 error) {'
          assert old in s
          s=s.replace(old,'''func (j *Journal) ProcessLegacyMsg(dumpChan chan *library.FluentMsg) (int64, error) {
              return j.processLegacyMsg(context.Background(), dumpChan)
          }
          func (j *Journal) processLegacyMsg(ctx context.Context, dumpChan chan *library.FluentMsg) (maxID int64, err2 error) {''')
          start=s.index('// create ids writer');end=s.index('// create data writer',start)
          part=s[start:end]
          import re
          for arg in ['msg.ID','mid']:
              pattern=r'nRetry = 0\s*for nRetry < maxRetry \{\s*if err = jj.WriteId\('+re.escape(arg)+r'\); err != nil \{\s*nRetry\+\+\s*\}\s*break\s*\}'
              part,n=re.subn(pattern,'err = writeCommittedID(jj.WriteId, '+arg+')',part)
              assert n==1,(arg,n)
          part=part.replace('err != nil && nRetry == maxRetry','err != nil')
          part=re.sub(r'\n\s*nRetry\s+int','',part)
          part=re.sub(r'\n\s*maxRetry\s*= 2','',part)
          s=s[:start]+part+s[end:]
          s+='''
          // writeCommittedID centralizes acknowledgement-write retry handling.
          func writeCommittedID(write func(int64) error, id int64) (err error) {
              nRetry := 0
              for nRetry < 2 {
                  if err = write(id); err != nil { nRetry++ }
                  break
              }
              return err
          }
          '''
          p.write_text(s)
          Path('internal/controller/journal_reliability_test.go').write_text(r'''package controller

          import (
              "context"
              "errors"
              "io"
              "os"
              "path/filepath"
              "sync"
              "testing"
              "time"
              "gofluentd/library"
              journal "github.com/Laisky/go-journal"
              utils "github.com/Laisky/go-utils"
          )

          func regressionReplayJournal(t *testing.T, committed bool) (*Journal,*journal.Journal,string) {
              t.Helper()
              dir:=t.TempDir()
              ctx,cancel:=context.WithCancel(context.Background());t.Cleanup(cancel)
              backend,err:=journal.NewJournal(journal.WithBufDirPath(dir),journal.WithBufSizeByte(8192),journal.WithRotateDuration(time.Hour),journal.WithIsAggresiveGC(false))
              if err!=nil {t.Fatal(err)}
              if err=backend.Start(ctx);err!=nil {t.Fatal(err)}
              data:=&journal.Data{ID:42,Data:map[string]interface{}{"tag":"logs","message":map[string]interface{}{"payload":"must-survive"}}}
              if err=backend.WriteData(data);err!=nil {t.Fatal(err)}
              if committed {if err=backend.WriteId(42);err!=nil {t.Fatal(err)}}
              // The legacy loader deliberately retains the latest closed segment.
              for i:=0;i<2;i++ {if err=backend.Rotate(ctx);err!=nil {t.Fatal(err)}}
              j:=&Journal{JournalCfg:&JournalCfg{MsgPool:&sync.Pool{New:func()interface{}{return &library.FluentMsg{}}}},legacyLock:utils.NewMutex(),tag2JMap:&sync.Map{}}
              j.tag2JMap.Store("logs",backend)
              return j,backend,dir
          }
          func regressionDiskHasMessage(t *testing.T,dir string)bool {
              t.Helper()
              names,err:=filepath.Glob(filepath.Join(dir,"*.buf"));if err!=nil {t.Fatal(err)}
              for _,name:=range names {
                  fp,err:=os.Open(name);if err!=nil{t.Fatal(err)}
                  dec,err:=journal.NewDataDecoder(fp,false);if err!=nil{fp.Close();t.Fatal(err)}
                  for {var data journal.Data;err=dec.Read(&data);if err==io.EOF{break};if err!=nil{fp.Close();t.Fatal(err)};if data.ID==42{fp.Close();return true}}
                  fp.Close()
              }
              return false
          }
          func TestRegressionReplayPreservesDiskCopyBeforeQueueConsumption(t *testing.T){
              j,_,dir:=regressionReplayJournal(t,false)
              if !regressionDiskHasMessage(t,dir){t.Fatal("invalid fixture: missing initial durable record")}
              queue:=make(chan *library.FluentMsg,8) // Deliberately no writer/consumer.
              max,err:=j.ProcessLegacyMsg(queue);if err!=nil{t.Fatal(err)}
              if max!=42 || len(queue)!=1{t.Fatalf("replay did not exercise the record: max=%d queued=%d",max,len(queue))}
              if !regressionDiskHasMessage(t,dir){t.Error("replay deleted the only disk copy while the replacement was only queued in memory")}
          }
          func TestRegressionReplaySkipsAcknowledgedRecord(t *testing.T){
              j,_,_:=regressionReplayJournal(t,true)
              queue:=make(chan *library.FluentMsg,8)
              if _,err:=j.ProcessLegacyMsg(queue);err!=nil{t.Fatal(err)}
              if len(queue)!=0{t.Error("acknowledged record was replayed")}
          }
          func TestRegressionReplayCancellation(t *testing.T){
              j,_,_:=regressionReplayJournal(t,false)
              ctx,cancel:=context.WithCancel(context.Background());cancel()
              done:=make(chan error,1)
              go func(){_,err:=j.processLegacyMsg(ctx,make(chan *library.FluentMsg));done<-err}()
              select {case err:=<-done:if !errors.Is(err,context.Canceled){t.Errorf("error=%v, want cancellation",err)};case <-time.After(250*time.Millisecond):t.Error("replay ignores cancellation while output is blocked")}
          }
          func TestRegressionCommittedIDRetry(t *testing.T){
              sentinel:=errors.New("disk unavailable")
              for _,tc:=range []struct{name string;failures,wantCalls int;wantErr bool}{{"success",0,1,false},{"transient",1,2,false},{"permanent",10,2,true}}{
                  t.Run(tc.name,func(t *testing.T){
                      calls:=0
                      err:=writeCommittedID(func(id int64)error{calls++;if id!=42{t.Errorf("ID=%d",id)};if calls<=tc.failures{return sentinel};return nil},42)
                      if calls!=tc.wantCalls || (err!=nil)!=tc.wantErr{t.Errorf("calls=%d err=%v; want calls=%d wantErr=%v",calls,err,tc.wantCalls,tc.wantErr)}
                      if tc.wantErr && !errors.Is(err,sentinel){t.Error("original write error was lost")}
                  })
              }
          }
          ''')
          PY
          gofmt -w internal/controller/journal.go internal/controller/journal_reliability_test.go
          go test -mod=readonly -run '^$' ./...
          git config user.name 'Laisky'
          git config user.email 'public@laisky.com'
          git add internal/controller/journal.go internal/controller/journal_reliability_test.go
          git commit -m 'test: reproduce loss of the only durable replay copy and broken ID retries'
          git push origin HEAD:refs/heads/fix/go127-reliability
          python3 - <<'PY'
          import subprocess,json
          p=subprocess.run(['go','test','-json','-mod=readonly','-count=1','-timeout=30s','-run','TestRegressionReplay|TestRegressionCommittedIDRetry','./internal/controller'],capture_output=True,text=True)
          print(p.stdout);print(p.stderr)
          events=[json.loads(x) for x in p.stdout.splitlines() if x.startswith('{')]
          failed={x.get('Test') for x in events if x.get('Action')=='fail'}
          passed={x.get('Test') for x in events if x.get('Action')=='pass'}
          required={'TestRegressionReplayPreservesDiskCopyBeforeQueueConsumption','TestRegressionReplayCancellation','TestRegressionCommittedIDRetry'}
          assert required<=failed,(required-failed,failed)
          assert 'TestRegressionReplaySkipsAcknowledgedRecord' in passed
          assert 'TestRegressionCommittedIDRetry/success' in passed
          PY
      - name: Pin the repaired journal and fix replay handoff ordering
        run: |
          go get github.com/Laisky/go-journal@3ed625db57b2e6015f119ecb754e2ada204b8df9
          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/controller/journal.go');s=p.read_text()
          start=s.index('func (j *Journal) processLegacyMsg(');end=s.index('// createJournalRunner',start)
          s=s[:start]+'''// processLegacyMsg writes each retained record before publishing its in-memory
          // copy. go-journal synchronizes replacement files before legacy cleanup.
          func (j *Journal) processLegacyMsg(ctx context.Context, out chan *library.FluentMsg) (maxID int64, resultErr error) {
              if !j.legacyLock.TryLock() { return 0, fmt.Errorf("another legacy is running") }
              defer j.legacyLock.ForceRelease()
              var wg sync.WaitGroup
              var mu sync.Mutex
              j.tag2JMap.Range(func(k, v interface{}) bool {
                  wg.Add(1)
                  go func(tag string, jj *journal.Journal) {
                      defer wg.Done()
                      var innerMax int64
                      var replayErr error
                      defer func(){
                          mu.Lock()
                          defer mu.Unlock()
                          if innerMax > maxID { maxID = innerMax }
                          if replayErr != nil && resultErr == nil { resultErr = errors.Wrapf(replayErr, "replay tag %s", tag) }
                      }()
                      if !jj.LockLegacy() { return }
                      defer jj.UnLockLegacy()
                      for {
                          if replayErr = ctx.Err(); replayErr != nil { return }
                          data := &journal.Data{Data: map[string]interface{}{}}
                          if err := jj.LoadLegacyBuf(data); err == io.EOF { return } else if err != nil { replayErr = err; return }
                          storedTag, tagOK := data.Data["tag"].(string)
                          message, messageOK := data.Data["message"].(map[string]interface{})
                          if !tagOK || !messageOK { replayErr = fmt.Errorf("invalid persisted message %d", data.ID); return }
                          // No asynchronous queue can stand in for a durable copy.
                          if replayErr = jj.WriteData(data); replayErr != nil { return }
                          if data.ID > innerMax { innerMax = data.ID }
                          msg := j.MsgPool.Get().(*library.FluentMsg)
                          *msg = library.FluentMsg{ID: data.ID, Tag: storedTag, Message: message}
                          select {
                          case out <- msg:
                          case <-ctx.Done():
                              j.MsgPool.Put(msg)
                              replayErr = ctx.Err()
                              return
                          }
                      }
                  }(k.(string), v.(*journal.Journal))
                  return true
              })
              wg.Wait()
              return maxID, resultErr
          }

          '''+s[end:]
          old='j.ProcessLegacyMsg(dumpChan)'
          assert old in s
          s=s.replace(old,'j.processLegacyMsg(ctx, j.outChan)')
          start=s.index('func writeCommittedID(')
          s=s[:start]+'''func writeCommittedID(write func(int64) error, id int64) (err error) {
              for attempt := 0; attempt < 2; attempt++ {
                  if err = write(id); err == nil { return nil }
              }
              return err
          }
          '''
          p.write_text(s)
          p=Path('internal/controller/journal_reliability_test.go');s=p.read_text()
          needle='if err = backend.Start(ctx); err != nil {\n\t\tt.Fatal(err)\n\t}'
          assert needle in s
          s=s.replace(needle,needle+'\n\tt.Cleanup(backend.Close)')
          p.write_text(s)
          PY
          gofmt -w internal/controller/journal.go internal/controller/journal_reliability_test.go
          go test -mod=readonly -count=1 -v -timeout=60s -run TestRegression ./internal/controller
          go test -mod=readonly -race -count=10 -timeout=180s -run TestRegression ./internal/controller
          go test -mod=readonly -count=1 -timeout=120s ./...
          go test -mod=readonly -race -count=1 -timeout=120s ./...
          go vet -mod=readonly ./...
          go build -mod=readonly ./...
          git add go.mod go.sum internal/controller/journal.go internal/controller/journal_reliability_test.go
          git diff --cached --check
          git commit -m 'fix: persist replay copies before reclamation and retry acknowledgement writes'
          git push origin HEAD:refs/heads/fix/go127-reliability
          git rev-parse HEAD
