name: Validate private delivery fixture
on:
  push:
    branches: [codex/security-final-review-20261006]
    paths: [.github/workflows/security32-fixture-blob.yml]
permissions:
  contents: write
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Apply exact reviewed fixture diff
        run: |
          set -euo pipefail
          git checkout --detach c6a6725087a74af7fb712d6294aae9de63b9e419
          mkdir -p /tmp/fixture-evidence
          python3 - <<'PY'
          import base64, hashlib, pathlib, zlib
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded))
          if hashlib.sha256(patch).hexdigest() != '9b93c79c89de2a4de9cd0ce55e4476b825aceb82fbf52c25600175be3585fa89':
              raise SystemExit('fixture transport checksum mismatch')
          pathlib.Path('/tmp/fixture-evidence/fixture.patch').write_bytes(patch)
          PY
          git apply /tmp/fixture-evidence/fixture.patch
          test "$(git hash-object tests/delivery/test_delivery.py)" = 031f571a786d5bbec86299fae035823e2c1cfb4e
          git diff --check
      - name: Fixture behavior and real process recovery
        run: |
          set -euo pipefail
          PYTHONPATH=tests/delivery python3 -m unittest test_delivery.AppFixtureTests -v 2>&1 | tee /tmp/fixture-evidence/fixture.log
          go build -mod=readonly -race -o /tmp/fixture-app .
          python3 tests/combined_formats/run.py --binary /tmp/fixture-app --artifacts /tmp/fixture-evidence/combined 2>&1 | tee /tmp/fixture-evidence/combined.log
          python3 tests/combined_formats/run.py --audit-only --artifacts /tmp/fixture-evidence/combined
      - name: Store the verified content blob without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          payload = {'content': pathlib.Path('tests/delivery/test_delivery.py').read_text(), 'encoding': 'utf-8'}
          pathlib.Path('/tmp/fixture-payload.json').write_text(json.dumps(payload))
          PY
          gh api --method POST repos/Laisky/go-fluentd/git/blobs --input /tmp/fixture-payload.json > /tmp/fixture-evidence/blob.json
          python3 - <<'PY'
          import json, pathlib
          blob = json.loads(pathlib.Path('/tmp/fixture-evidence/blob.json').read_text())
          if blob['sha'] != '031f571a786d5bbec86299fae035823e2c1cfb4e':
              raise SystemExit('published blob does not match reviewed source')
          print(blob['sha'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: private-delivery-fixture-evidence
          path: /tmp/fixture-evidence/
          retention-days: 14
          if-no-files-found: error
