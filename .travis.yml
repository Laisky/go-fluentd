language: go

go:
  - 1.27.x

install: true

git:
  depth: 1

cache:
  directories:
    - $HOME/.cache/go-build
    - $GOPATH/pkg/mod

script:
  - go mod download
  - go mod verify
  - go build -mod=readonly ./...
  - go vet -mod=readonly ./...
  - go test -mod=readonly -race -count=1 -timeout=180s -coverprofile=coverage.txt -covermode=atomic ./...
